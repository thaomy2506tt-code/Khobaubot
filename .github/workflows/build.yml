name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tu Dong Tao Ma Nguon Ung Dung
        run: |
          mkdir -p app/src/main/java/com/example/autoimagebot/detector
          mkdir -p app/src/main/java/com/example/autoimagebot/engine
          mkdir -p app/src/main/java/com/example/autoimagebot/service
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Khobaubot"
          include ':app'
          EOF

          # 2. build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.autoimagebot'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autoimagebot"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 5. Strings & Config
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">KhobauBot</string>
              <string name="accessibility_desc">Ho tro tu dong quet anh va di chuyen</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # 6. Layouts
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="KhobauBot Auto Macro"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp" />

              <Button
                  android:id="@+id/btn_launch_overlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="KHOI DONG NUT NOI &amp; CAP QUYEN" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_floating_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/layout_root"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="#CC1E1E1E"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:padding="8dp">

              <TextView
                  android:id="@+id/tv_drag_handle"
                  android:layout_width="28dp"
                  android:layout_height="36dp"
                  android:gravity="center"
                  android:text=":::"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp" />

              <Button
                  android:id="@+id/btn_toggle"
                  android:layout_width="wrap_content"
                  android:layout_height="36dp"
                  android:background="#2E7D32"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:text="START"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <Button
                  android:id="@+id/btn_close"
                  android:layout_width="36dp"
                  android:layout_height="36dp"
                  android:background="#C62828"
                  android:text="X"
                  android:textColor="#FFFFFF"
                  android:layout_marginStart="6dp" />
          </LinearLayout>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.autoimagebot">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="KhobauBot"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".service.FloatingOverlayService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name=".service.ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

          # 8. Kotlin Sources
          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/detector/ImageMatcher.kt
          package com.example.autoimagebot.detector

          import android.graphics.Bitmap
          import android.graphics.PointF

          object ImageMatcher {
              fun findTarget(screen: Bitmap, template: Bitmap, threshold: Double = 0.70): PointF? {
                  val sW = screen.width
                  val sH = screen.height
                  val tW = template.width
                  val tH = template.height
                  if (tW > sW || tH > sH || tW <= 0 || tH <= 0) return null

                  val tPixels = IntArray(tW * tH)
                  template.getPixels(tPixels, 0, tW, 0, 0, tW, tH)

                  val step = 6
                  var bestX = -1
                  var bestY = -1
                  var minDiff = Double.MAX_VALUE
                  val totalSamples = (tW / step) * (tH / step)
                  if (totalSamples == 0) return null
                  val maxPossibleDiff = 255.0 * 3.0 * totalSamples

                  val sPixels = IntArray(sW * sH)
                  screen.getPixels(sPixels, 0, sW, 0, 0, sW, sH)

                  for (y in 0 until (sH - tH) step (step * 2)) {
                      for (x in 0 until (sW - tW) step (step * 2)) {
                          var diff = 0.0
                          for (ty in 0 until tH step step) {
                              for (tx in 0 until tW step step) {
                                  val tp = tPixels[ty * tW + tx]
                                  val sp = sPixels[(y + ty) * sW + (x + tx)]
                                  val dr = (tp shr 16 and 0xFF) - (sp shr 16 and 0xFF)
                                  val dg = (tp shr 8 and 0xFF) - (sp shr 8 and 0xFF)
                                  val db = (tp and 0xFF) - (sp and 0xFF)
                                  diff += kotlin.math.abs(dr) + kotlin.math.abs(dg) + kotlin.math.abs(db)
                              }
                          }
                          if (diff < minDiff) {
                              minDiff = diff
                              bestX = x
                              bestY = y
                          }
                      }
                  }

                  val score = 1.0 - (minDiff / maxPossibleDiff)
                  return if (score >= threshold && bestX >= 0) {
                      PointF((bestX + tW / 2).toFloat(), (bestY + tH / 2).toFloat())
                  } else {
                      null
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/service/BotAccessibilityService.kt
          package com.example.autoimagebot.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.sin

          class BotAccessibilityService : AccessibilityService() {

              companion object {
                  var instance: BotAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun moveToward(joyX: Float, joyY: Float, targetX: Float, targetY: Float, joyRadius: Float = 120f, holdTimeMs: Long = 500) {
                  val dx = targetX - joyX
                  val dy = targetY - joyY
                  val angle = atan2(dy.toDouble(), dx.toDouble())

                  val destX = joyX + (joyRadius * cos(angle)).toFloat()
                  val destY = joyY + (joyRadius * sin(angle)).toFloat()

                  val path = Path().apply {
                      moveTo(joyX, joyY)
                      lineTo(destX, destY)
                  }

                  val stroke = GestureDescription.StrokeDescription(path, 0, holdTimeMs)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  dispatchGesture(gesture, null, null)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/engine/BotEngine.kt
          package com.example.autoimagebot.engine

          import android.graphics.Bitmap
          import android.graphics.Color
          import com.example.autoimagebot.detector.ImageMatcher
          import com.example.autoimagebot.service.BotAccessibilityService
          import kotlinx.coroutines.*

          class BotEngine(
              private val joyCenterX: Float,
              private val joyCenterY: Float
          ) {
              private var isRunning = false
              private var job: Job? = null
              private val templateBitmap: Bitmap = Bitmap.createBitmap(40, 40, Bitmap.Config.ARGB_8888).apply {
                  eraseColor(Color.rgb(255, 215, 0))
              }

              fun start(captureProvider: () -> Bitmap?) {
                  isRunning = true
                  job = CoroutineScope(Dispatchers.Default).launch {
                      while (isRunning) {
                          val currentScreen = captureProvider()
                          if (currentScreen != null) {
                              val targetLocation = ImageMatcher.findTarget(currentScreen, templateBitmap, 0.70)
                              if (targetLocation != null) {
                                  BotAccessibilityService.instance?.moveToward(
                                      joyX = joyCenterX,
                                      joyY = joyCenterY,
                                      targetX = targetLocation.x,
                                      targetY = targetLocation.y,
                                      holdTimeMs = 400
                                  )
                              }
                          }
                          delay(150)
                      }
                  }
              }

              fun stop() {
                  isRunning = false
                  job?.cancel()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/service/ScreenCaptureService.kt
          package com.example.autoimagebot.service

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.IBinder
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import com.example.autoimagebot.engine.BotEngine

          class ScreenCaptureService : Service() {

              companion object {
                  var instance: ScreenCaptureService? = null
                  private const val NOTIFICATION_ID = 8888
                  private const val CHANNEL_ID = "ScreenCaptureChannel"
              }

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var botEngine: BotEngine? = null
              private var screenDensity = 0
              private var screenWidth = 720
              private var screenHeight = 1280

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, createNotification())

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealMetrics(metrics)
                  screenWidth = metrics.widthPixels
                  screenHeight = metrics.heightPixels
                  screenDensity = metrics.densityDpi
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) return START_NOT_STICKY

                  val resultCode = intent.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED)
                  val data = intent.getParcelableExtra<Intent>("DATA")

                  if (resultCode == Activity.RESULT_OK && data != null) {
                      val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mediaProjection = mpManager.getMediaProjection(resultCode, data)

                      imageReader = ImageReader.newInstance(screenWidth, screenHeight, PixelFormat.RGBA_8888, 2)

                      virtualDisplay = mediaProjection?.createVirtualDisplay(
                          "ScreenCapture",
                          screenWidth, screenHeight, screenDensity,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader?.surface, null, null
                      )

                      val joyCenterX = screenWidth * 0.25f
                      val joyCenterY = screenHeight * 0.75f

                      botEngine = BotEngine(joyCenterX, joyCenterY)
                  }

                  return START_STICKY
              }

              fun startBot() {
                  botEngine?.start { getLatestScreenshot() }
              }

              fun stopBot() {
                  botEngine?.stop()
              }

              fun getLatestScreenshot(): Bitmap? {
                  val image = imageReader?.acquireLatestImage() ?: return null
                  return try {
                      val planes = image.planes
                      val buffer = planes[0].buffer
                      val pixelStride = planes[0].pixelStride
                                            val rowStride = planes[0].rowStride
                      val rowPadding = rowStride - pixelStride * screenWidth

                      val bitmap = Bitmap.createBitmap(
                          screenWidth + rowPadding / pixelStride,
                          screenHeight,
                          Bitmap.Config.ARGB_8888
                      )
                      bitmap.copyPixelsFromBuffer(buffer)
                      if (rowPadding > 0) {
                          Bitmap.createBitmap(bitmap, 0, 0, screenWidth, screenHeight)
                      } else {
                          bitmap
                      }
                  } catch (e: Exception) {
                      null
                  } finally {
                      image.close()
                  }
              }

              private fun createNotification(): Notification {
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("KhobauBot Service")
                      .setContentText("Dich vu quet man hinh dang hoat dong...")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "KhobauBot Capture Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  botEngine?.stop()
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/service/FloatingOverlayService.kt
          package com.example.autoimagebot.service

          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.Button
          import android.widget.TextView
          import com.example.autoimagebot.R

          class FloatingOverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams
              private var isBotRunning = false

              override fun onBind(intent: Intent?): IBinder? = null

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.layout_floating_widget, null)

                  val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutFlag,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 200
                  }

                  windowManager.addView(floatingView, params)

                  val btnToggle = floatingView.findViewById<Button>(R.id.btn_toggle)
                  val btnClose = floatingView.findViewById<Button>(R.id.btn_close)
                  val dragHandle = floatingView.findViewById<TextView>(R.id.tv_drag_handle)

                  btnToggle.setOnClickListener {
                      isBotRunning = !isBotRunning
                      if (isBotRunning) {
                          btnToggle.text = "STOP"
                          btnToggle.setBackgroundColor(Color.parseColor("#C62828"))
                          ScreenCaptureService.instance?.startBot()
                      } else {
                          btnToggle.text = "START"
                          btnToggle.setBackgroundColor(Color.parseColor("#2E7D32"))
                          ScreenCaptureService.instance?.stopBot()
                      }
                  }

                  btnClose.setOnClickListener {
                      stopSelf()
                  }

                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f

                  dragHandle.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager.updateViewLayout(floatingView, params)
                              true
                          }
                          else -> false
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  ScreenCaptureService.instance?.stopBot()
                  if (::floatingView.isInitialized) {
                      windowManager.removeView(floatingView)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/MainActivity.kt
          package com.example.autoimagebot

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.example.autoimagebot.service.FloatingOverlayService
          import com.example.autoimagebot.service.ScreenCaptureService

          class MainActivity : AppCompatActivity() {

              private val REQ_OVERLAY = 1001
              private val REQ_MEDIA_PROJECTION = 1002

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val btn = findViewById<Button>(R.id.btn_launch_overlay)
                  btn.setOnClickListener {
                      checkPermissionsAndStart()
                  }
              }

              private fun checkPermissionsAndStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Vui long cap quyen Cua so noi", Toast.LENGTH_SHORT).show()
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      startActivityForResult(intent, REQ_OVERLAY)
                      return
                  }

                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpManager.createScreenCaptureIntent(), REQ_MEDIA_PROJECTION)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_MEDIA_PROJECTION && resultCode == Activity.RESULT_OK && data != null) {
                      val captureIntent = Intent(this, ScreenCaptureService::class.java).apply {
                          putExtra("RESULT_CODE", resultCode)
                          putExtra("DATA", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(captureIntent)
                      } else {
                          startService(captureIntent)
                      }

                      val overlayIntent = Intent(this, FloatingOverlayService::class.java)
                      startService(overlayIntent)

                      moveTaskToBack(true)
                  }
              }
          }
          EOF

      - name: Build KhobauBot APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Xuat File APK Tai Ve
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-APK
          path: app/build/outputs/apk/debug/*.apk
