name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tao Toan Bo Du An KhobauBot
        run: |
          mkdir -p app/src/main/java/com/bot app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Khobaubot"
          include ':app'
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.bot'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.bot'
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/acc.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="KhobauBot" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.bot.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name="com.bot.BotAccService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
                  <service android:name="com.bot.FloatingService" android:exported="false"/>
                  <service android:name="com.bot.CaptureService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/bot/App.kt
          package com.bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val btn = Button(this).apply {
                      text = "BẬT BOT & CẤP QUYỀN"
                      textSize = 18f
                  }
                  setContentView(btn)
                  btn.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Cap quyen cua so noi!", Toast.LENGTH_SHORT).show()
                          startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1)
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2 && res == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java).apply {
                          putExtra("C", res)
                          putExtra("D", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                      startService(Intent(this, FloatingService::class.java))
                      moveTaskToBack(true)
                  }
              }
          }

          class BotAccService : AccessibilityService() {
              companion object { var inst: BotAccService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); inst = this }
              override fun onDestroy() { super.onDestroy(); inst = null }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              fun swipe(x1: Float, y1: Float, x2: Float, y2: Float) {
                  val p = Path().apply { moveTo(x1, y1); lineTo(x2, y2) }
                  val stroke = GestureDescription.StrokeDescription(p, 0, 350)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }
          }

          class CaptureService : Service() {
              companion object { var inst: CaptureService? = null }
              private var mp: MediaProjection? = null
              private var running = false
              private var job: Job? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  val chId = "c1"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val m = getSystemService(NotificationManager::class.java)
                      m?.createNotificationChannel(NotificationChannel(chId, "Cap", NotificationManager.IMPORTANCE_LOW))
                  }
                  val n = NotificationCompat.Builder(this, chId).setContentTitle("KhobauBot Running").setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("C", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("D")
                  if (code == Activity.RESULT_OK && data != null) {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mp = mpm.getMediaProjection(code, data)
                      mp?.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
                      val dm = resources.displayMetrics
                      val reader = ImageReader.newInstance(dm.widthPixels, dm.heightPixels, PixelFormat.RGBA_8888, 2)
                      mp?.createVirtualDisplay("V", dm.widthPixels, dm.heightPixels, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.surface, null, null)
                  }
                  return START_STICKY
              }

              fun toggle(): Boolean {
                  running = !running
                  if (running) {
                      job = CoroutineScope(Dispatchers.Default).launch {
                          val dm = resources.displayMetrics
                          val jx = dm.widthPixels * 0.25f
                          val jy = dm.heightPixels * 0.75f
                          while (running) {
                              BotAccService.inst?.swipe(jx, jy, jx, jy - 150f)
                              delay(500)
                          }
                      }
                  } else {
                      job?.cancel()
                  }
                  return running
              }

              override fun onDestroy() {
                  super.onDestroy()
                  running = false
                  job?.cancel()
                  mp?.stop()
                  inst = null
              }
          }

          class FloatingService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var btn: Button

              override fun onBind(intent: Intent?): IBinder? = null

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  btn = Button(this).apply {
                      text = "START"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                  }
                  val t = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      t,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 200
                  }
                  wm.addView(btn, p)

                  btn.setOnClickListener {
                      val active = CaptureService.inst?.toggle() ?: false
                      btn.text = if (active) "STOP" else "START"
                      btn.setBackgroundColor(if (active) Color.RED else Color.parseColor("#2E7D32"))
                  }

                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  btn.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = p.x; iy = p.y; tx = e.rawX; ty = e.rawY; false }
                          MotionEvent.ACTION_MOVE -> { p.x = ix + (e.rawX - tx).toInt(); p.y = iy + (e.rawY - ty).toInt(); wm.updateViewLayout(btn, p); true }
                          else -> false
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::btn.isInitialized) wm.removeView(btn)
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-APK
          path: app/build/outputs/apk/debug/*.apk
