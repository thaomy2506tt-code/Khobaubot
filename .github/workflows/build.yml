name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tao Cau Hinh He Thong
        run: |
          mkdir -p app/src/main/java/com/bot app/src/main/res/xml
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'Khobaubot'; include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo -e "plugins {\n id 'com.android.application' version '8.2.2' apply false\n id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}" > build.gradle

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.bot'; compileSdk 34
              defaultConfig { applicationId 'com.bot'; minSdk 24; targetSdk 33; versionCode 47; versionName '6.3' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          EOF

          echo '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" />' > app/src/main/res/xml/acc.xml

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="KhobauBot" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="ocr" />
                  <activity android:name="com.bot.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name="com.bot.BotAccService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
                  <service android:name="com.bot.FloatingService" android:exported="false"/>
                  <service android:name="com.bot.CaptureService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF
      - name: Tao Code App Va Build APK
        run: |
          cat << 'EOF' > app/src/main/java/com/bot/App.kt
          package com.bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.util.concurrent.TimeUnit
          import kotlin.math.*

          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import com.google.android.gms.tasks.Tasks

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(40, 40, 40, 40) }
                  val bAcc = Button(this).apply { text = "1. BẬT TRỢ NĂNG (BẮT BUỘC)"; setBackgroundColor(Color.parseColor("#E65100")); setTextColor(Color.WHITE) }
                  val bStart = Button(this).apply { text = "2. KHỞI ĐỘNG KHOBAUBOT"; setBackgroundColor(Color.parseColor("#2E7D32")); setTextColor(Color.WHITE) }
                  l.addView(bAcc); l.addView(bStart); setContentView(l)

                  bAcc.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Tìm KhobauBot và Gạt BẬT!", Toast.LENGTH_LONG).show()
                  }
                  bStart.setOnClickListener {
                      if (BotAccService.inst == null) {
                          Toast.makeText(this, "Vui lòng bật quyền Trợ năng ở nút 1 trước!", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Cấp quyền Cửa sổ nổi!", Toast.LENGTH_SHORT).show()
                          startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1)
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  }
              }
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2 && res == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java).apply { putExtra("C", res); putExtra("D", data) }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                      startService(Intent(this, FloatingService::class.java))
                      moveTaskToBack(true)
                  }
              }
          }

          class BotAccService : AccessibilityService() {
              companion object { var inst: BotAccService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); inst = this }
              override fun onDestroy() { super.onDestroy(); inst = null }
              override fun onAccessibilityEvent(e: android.view.accessibility.AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun walkToward(jx: Float, jy: Float, angle: Double, dMs: Long = 180) {
                  val p = Path().apply {
                      moveTo(jx, jy)
                      lineTo(jx + (115f * cos(angle)).toFloat(), jy + (115f * sin(angle)).toFloat())
                  }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, dMs)).build(), null, null)
              }
          }

          data class VisualTile(val id: Int, val x: Float, val y: Float, val isActive: Boolean, val statusText: String, val worldX: Int?, val worldY: Int?)

          // VIEW HIỂN THỊ TRỰC QUAN ĐÁNH SỐ TỪ 1 ĐẾN 10
          class TrackingOverlayView(ctx: Context) : View(ctx) {
              var isHudVisible = true
              private var tileList = listOf<VisualTile>()
              private var playerPos: PointF? = null
              private var bannerText = ""
              private val scanRadius = 280f

              private val pActiveBox = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 3.5f; color = Color.parseColor("#00E676"); isAntiAlias = true }
              private val pWaitingBox = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 2.5f; color = Color.parseColor("#FFD600"); isAntiAlias = true }
              private val pRadius = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 1.5f; color = Color.parseColor("#4DFFFFFF"); pathEffect = DashPathEffect(floatArrayOf(12f, 12f), 0f); isAntiAlias = true }

              private val pBadgeActive = Paint().apply { style = Paint.Style.FILL; color = Color.parseColor("#00E676"); isAntiAlias = true }
              private val pBadgeWaiting = Paint().apply { style = Paint.Style.FILL; color = Color.parseColor("#FFB300"); isAntiAlias = true }

              private val pNumText = Paint().apply { textSize = 20f; isFakeBoldText = true; color = Color.BLACK; textAlign = Paint.Align.CENTER; isAntiAlias = true }
              private val pStatusText = Paint().apply { textSize = 17f; isFakeBoldText = true; color = Color.WHITE; setShadowLayer(3f, 1f, 1f, Color.BLACK); isAntiAlias = true }

              private val pBannerBg = Paint().apply { color = Color.parseColor("#B3000000"); style = Paint.Style.FILL }
              private val pBannerText = Paint().apply { textSize = 21f; isFakeBoldText = true; color = Color.WHITE; isAntiAlias = true }

              fun updateDisplay(tiles: List<VisualTile>, pX: Float, pY: Float, banner: String) {
                  tileList = tiles; playerPos = PointF(pX, pY); bannerText = banner; postInvalidate()
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  if (!isHudVisible) return

                  // 1. Vòng tròn bán kính quét quanh nhân vật
                  playerPos?.let { p ->
                      c.drawCircle(p.x, p.y, scanRadius, pRadius)
                  }

                  // 2. Vẽ từng ô từ 1 tới 10
                  for (tile in tileList) {
                      val r = RectF(tile.x - 26f, tile.y - 26f, tile.x + 26f, tile.y + 26f)
                      val isAct = tile.isActive

                      c.drawRoundRect(r, 6f, 6f, if (isAct) pActiveBox else pWaitingBox)

                      // Vòng tròn huy hiệu số thứ tự 1..10
                      val badgeX = tile.x
                      val badgeY = tile.y - 32f
                      c.drawCircle(badgeX, badgeY, 15f, if (isAct) pBadgeActive else pBadgeWaiting)

                      // Chữ số 1, 2, 3... 10
                      val numY = badgeY - ((pNumText.descent() + pNumText.ascent()) / 2f)
                      c.drawText(tile.id.toString(), badgeX, numY, pNumText)

                      // Trạng thái ô số 1
                      if (tile.statusText.isNotEmpty()) {
                          c.drawText(tile.statusText, tile.x - 30f, tile.y + 44f, pStatusText)
                      }
                  }

                  // 3. Thanh thông tin GPS ở trên
                  if (bannerText.isNotEmpty()) {
                      c.drawRoundRect(25f, 65f, 620f, 128f, 12f, 12f, pBannerBg)
                      c.drawText(bannerText, 40f, 106f, pBannerText)
                  }
              }
          }

          class CaptureService : Service() {
              companion object { var inst: CaptureService? = null }
              private var mp: MediaProjection? = null
              private var reader: ImageReader? = null
              private var lastBmp: Bitmap? = null

              var joyX = 360f
              var joyY = 820f

              private val textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

              private var currX: Int? = null
              private var currY: Int? = null
              private var homeX: Int? = null
              private var homeY: Int? = null

              // DANH SÁCH HÀNG ĐỢI 10 Ô (Screen Point, World X, World Y)
              data class TargetItem(var screenPt: PointF, val wX: Int, val wY: Int)
              private val targetQueue = mutableListOf<TargetItem>()

              private var isMiningCurrent = false
              private var mineStartTime = 0L

              // BỘ NHỚ Ô ĐÃ ĐẬP TRONG 15s ĐỂ TRÁNH QUAY LẠI
              private val minedTiles = mutableMapOf<Pair<Int, Int>, Long>()

              private var running = false
              private var job: Job? = null
              private var sW = 720
              private var sH = 1280
              private val scanRadius = 280f
              private val tileSize = 60f

              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  val dm = resources.displayMetrics
                  sW = dm.widthPixels; sH = dm.heightPixels
                  joyX = sW * 0.5f; joyY = sH * 0.64f

                  val chId = "bot_v63"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val m = getSystemService(NotificationManager::class.java)
                      m?.createNotificationChannel(NotificationChannel(chId, "Bot", NotificationManager.IMPORTANCE_LOW))
                  }
                  val n = NotificationCompat.Builder(this, chId).setContentTitle("KhobauBot 1-10 Queue").setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) startForeground(147, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION) else startForeground(147, n)
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("C", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("D")
                  if (code == Activity.RESULT_OK && data != null) {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mp = mpm.getMediaProjection(code, data)
                      mp?.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
                      reader = ImageReader.newInstance(sW, sH, PixelFormat.RGBA_8888, 2)
                      mp?.createVirtualDisplay("V", sW, sH, resources.displayMetrics.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader?.surface, null, null)
                  }
                  return START_STICKY
              }

              fun resetHomeManually() {
                  homeX = currX; homeY = currY
                  targetQueue.clear()
                  isMiningCurrent = false; minedTiles.clear()
                  Toast.makeText(this, "Đã chốt Gốc GPS: ($homeX, $homeY)", Toast.LENGTH_SHORT).show()
              }

              fun stopCompletely() {
                  running = false; job?.cancel()
                  try { mp?.stop() } catch (_: Exception) {}
                  try { reader?.close() } catch (_: Exception) {}
                  stopForeground(true); stopSelf()
              }

              fun getScreen(): Bitmap? {
                  val img = reader?.acquireLatestImage() ?: return lastBmp
                  try {
                      val pl = img.planes[0]; val buf = pl.buffer
                      val pad = pl.rowStride - pl.pixelStride * sW
                      val bmp = Bitmap.createBitmap(sW + pad / pl.pixelStride, sH, Bitmap.Config.ARGB_8888)
                      bmp.copyPixelsFromBuffer(buf)
                      lastBmp = if (pad > 0) Bitmap.createBitmap(bmp, 0, 0, sW, sH) else bmp
                  } catch (_: Exception) {} finally { img.close() }
                  return lastBmp
              }

              fun toggleRun(): Boolean {
                  running = !running
                  if (running) {
                      if (BotAccService.inst == null) {
                          Toast.makeText(this, "CHƯA BẬT TRỢ NĂNG!", Toast.LENGTH_LONG).show()
                          running = false; return false
                      }
                      homeX = null
                      homeY = null
                      targetQueue.clear()
                      isMiningCurrent = false
                      minedTiles.clear()

                      job = CoroutineScope(Dispatchers.Default).launch {
                          while (running) {
                              val scr = getScreen()
                              if (scr == null) { delay(80); continue }

                              val px = sW * 0.5f
                              val py = sH * 0.44f

                              // 1. ĐỌC TỌA ĐỘ GPS Ở GÓC TRÊN BÊN PHẢI MÀN HÌNH
                              val coord = extractCoordinates(scr)
                              if (coord != null) {
                                  currX = coord.first
                                  currY = coord.second
                                  if (homeX == null) { homeX = currX; homeY = currY }
                              }

                              if (currX == null || currY == null || homeX == null || homeY == null) {
                                  FloatingService.inst?.updateHUDList(emptyList(), px, py, "Đang đọc tọa độ góc phải...")
                                  delay(150); continue
                              }

                              val cX = currX!!
                              val cY = currY!!
                              val hX = homeX!!
                              val hY = homeY!!
                              val now = System.currentTimeMillis()

                              // Dọn dẹp danh sách ô đã đập sau 15s
                              val itMined = minedTiles.iterator()
                              while (itMined.hasNext()) {
                                  if (now - itMined.next().value > 15000L) itMined.remove()
                              }

                              // 2. GIỚI HẠN BÁN KÍNH 20 Ô SO VỚI GỐC KHỞI ĐẦU
                              if (abs(cX - hX) > 20 || abs(cY - hY) > 20) {
                                  targetQueue.clear()
                                  isMiningCurrent = false
                                  val angle = atan2((hY - cY).toDouble(), (hX - cX).toDouble())
                                  FloatingService.inst?.updateHUDList(emptyList(), px, py, "VƯỢT 20 Ô! Quay về Gốc ($hX, $hY)")
                                  BotAccService.inst?.walkToward(joyX, joyY, angle, 200)
                                  delay(210); continue
                              }

                              // 3. TỰ ĐỘNG BỔ SUNG ĐỦ 10 Ô VÀO HÀNG ĐỢI ĐÁNH SỐ 1..10
                              if (targetQueue.size < 10) {
                                  val fresh = scanSurroundingTilesWithCoords(scr, px, py, cX, cY, hX, hY)
                                  for (f in fresh) {
                                      if (targetQueue.none { it.wX == f.wX && it.wY == f.wY }) {
                                          targetQueue.add(f)
                                          if (targetQueue.size >= 10) break
                                      }
                                  }
                              }

                              // Cập nhật giao diện vẽ số 1..10 trên màn hình
                              updateVisualHUD(px, py, cX, cY)

                              if (targetQueue.isEmpty()) {
                                  delay(250); continue
                              }

                              // 4. MỤC TIÊU HIỆN TẠI LUÔN LÀ Ô SỐ 1 (targetQueue[0])
                              val curTarget = targetQueue[0]
                              val dist = hypot((curTarget.screenPt.x - px).toDouble(), (curTarget.screenPt.y - py).toDouble()).toFloat()
                              val isAtTargetCoord = (cX == curTarget.wX && cY == curTarget.wY)

                              // ĐÃ VÀO ĐÚNG TÂM Ô SỐ 1 -> THẢ CẦN ĐẬP ĐÁ
                              if (dist <= 22f || isAtTargetCoord || isMiningCurrent) {
                                  if (!isMiningCurrent) {
                                      isMiningCurrent = true
                                      mineStartTime = System.currentTimeMillis()
                                  }

                                  val timeElapsed = System.currentTimeMillis() - mineStartTime
                                  val isBroken = isTileBrokenToGrass(scr, px, py)

                                  // Ô 1 ĐÃ VỠ HOẶC HẾT 3.2S: XÓA Ô 1, DỒN HÀNG ĐỢI LÊN VÀ XOAY VÒNG
                                  if (isBroken || timeElapsed >= 3200L) {
                                      minedTiles[Pair(curTarget.wX, curTarget.wY)] = now
                                      targetQueue.removeAt(0)
                                      isMiningCurrent = false
                                      delay(100); continue
                                  }

                                  delay(250); continue
                              }

                              // CHƯA ĐẾN TÂM: KÉO JOYSTICK BƯỚC THẲNG VÀO TÂM Ô 1
                              val angle = atan2((curTarget.screenPt.y - py).toDouble(), (curTarget.screenPt.x - px).toDouble())
                              val isClose = dist < 35f
                              val stepMove = if (isClose) (dist * 0.85f) else 34f
                              val strokeMs = if (isClose) 120L else 180L

                              BotAccService.inst?.walkToward(joyX, joyY, angle, strokeMs)

                              // Bù trừ cuộn camera cho toàn bộ các ô 1..10 trên màn hình
                              val moveX = (stepMove * cos(angle)).toFloat()
                              val moveY = (stepMove * sin(angle)).toFloat()
                              for (i in 0 until targetQueue.size) {
                                  val oldPt = targetQueue[i].screenPt
                                  targetQueue[i].screenPt = PointF(oldPt.x - moveX, oldPt.y - moveY)
                              }

                              delay(strokeMs + 20)
                          }
                      }
                  } else {
                      job?.cancel()
                      FloatingService.inst?.updateHUDList(emptyList(), 0f, 0f, "")
                  }
                  return running
              }

              // CẬP NHẬT VIEW VẼ TRỰC QUAN 1..10
              private fun updateVisualHUD(px: Float, py: Float, cX: Int, cY: Int) {
                  val vList = mutableListOf<VisualTile>()
                  for (i in 0 until targetQueue.size) {
                      val item = targetQueue[i]
                      val isAct = (i == 0)
                      val st = if (isAct) (if (isMiningCurrent) "⛏ ĐANG ĐẬP" else "▶ TIẾN TÂM") else ""
                      vList.add(VisualTile(i + 1, item.screenPt.x, item.screenPt.y, isAct, st, item.wX, item.wY))
                  }
                  val banner = "GPS: ($cX, $cY) | Hàng đợi: ${targetQueue.size}/10 ô"
                  FloatingService.inst?.updateHUDList(vList, px, py, banner)
              }

              // OCR ĐỌC TỌA ĐỘ GÓC TRÊN BÊN PHẢI MÀN HÌNH
              private fun extractCoordinates(scr: Bitmap): Pair<Int, Int>? {
                  try {
                      val startX = (sW * 0.70f).toInt().coerceIn(0, scr.width - 20)
                      val startY = (sH * 0.08f).toInt().coerceIn(0, scr.height - 20)
                      val w = (sW * 0.28f).toInt().coerceAtMost(scr.width - startX)
                      val h = (sH * 0.12f).toInt().coerceAtMost(scr.height - startY)

                      val cropBmp = Bitmap.createBitmap(scr, startX, startY, w, h)
                      val image = InputImage.fromBitmap(cropBmp, 0)
                      val task = textRecognizer.process(image)
                      val result = Tasks.await(task, 350, TimeUnit.MILLISECONDS)

                      val regex = Regex("""(-?\d+)\s*,\s*([-\s]*\d+)""")
                      for (block in result.textBlocks) {
                          for (line in block.lines) {
                              val m = regex.find(line.text)
                              if (m != null) {
                                  val x = m.groupValues[1].replace(" ", "").toIntOrNull()
                                  val y = m.groupValues[2].replace(" ", "").toIntOrNull()
                                  if (x != null && y != null) return Pair(x, y)
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return null
              }

              // MÀU 3 LOẠI Ô ĐẤT WIKI (400hp, 900hp, 1100hp)
              private fun isWikiTileColor(r: Int, g: Int, b: Int): Boolean {
                  if (g > r + 18 && g > b + 18) return false // Cỏ xanh
                  if (r < 70 && g < 70 && b < 70) return false // Bóng đen

                  val isDirt400 = (r in 110..185 && g in 65..135 && b in 25..100 && r > g + 12 && g > b + 6)
                  val isStone900 = (r in 115..215 && g in 115..215 && b in 110..210 && abs(r - g) < 20 && abs(g - b) < 20 && r > 110)
                  val isMoss1100 = (g in 115..190 && r in 100..175 && b in 40..110 && g >= r - 12 && r > b + 20)

                  return isDirt400 || isStone900 || isMoss1100
              }

              // KIỂM TRA MỘT KHỐI VUÔNG 60x60 PIXEL ĐẶC
              private fun isSolidSquare60(scr: Bitmap, cx: Int, cy: Int): Boolean {
                  val checkPoints = arrayOf(
                      Pair(0, 0), Pair(-16, -16), Pair(16, -16),
                      Pair(-16, 16), Pair(16, 16), Pair(-16, 0),
                      Pair(16, 0), Pair(0, -16), Pair(0, 16)
                  )
                  var matchCount = 0
                  for (pt in checkPoints) {
                      val qx = (cx + pt.first).coerceIn(0, scr.width - 1)
                      val qy = (cy + pt.second).coerceIn(0, scr.height - 1)
                      val c = scr.getPixel(qx, qy)
                      if (isWikiTileColor(c shr 16 and 0xFF, c shr 8 and 0xFF, c and 0xFF)) matchCount++
                  }
                  return matchCount >= 6
              }

              // QUÉT TẤT CẢ CÁC Ô TRONG BÁN KÍNH VÀ TÍNH TOÁN RA TỌA ĐỘ THỰC TẾ
              private fun scanSurroundingTilesWithCoords(scr: Bitmap, px: Float, py: Float, cX: Int, cY: Int, hX: Int, hY: Int): List<TargetItem> {
                  val found = mutableListOf<TargetItem>()
                  val rInt = scanRadius.toInt()

                  val startX = (px - rInt).toInt().coerceIn(120, scr.width - 120)
                  val endX = (px + rInt).toInt().coerceIn(120, scr.width - 120)
                  val startY = (py - rInt).toInt().coerceIn((sH * 0.22f).toInt(), (sH * 0.65f).toInt())
                  val endY = (py + rInt).toInt().coerceIn((sH * 0.22f).toInt(), (sH * 0.65f).toInt())

                  for (y in startY until endY step 14) {
                      for (x in startX until endX step 14) {
                          val fx = x.toFloat(); val fy = y.toFloat()
                          val distScreen = hypot((fx - px).toDouble(), (fy - py).toDouble())

                          if (distScreen > scanRadius || distScreen < 35.0) continue

                          val c = scr.getPixel(x, y)
                          if (isWikiTileColor(c shr 16 and 0xFF, c shr 8 and 0xFF, c and 0xFF)) {
                              if (isSolidSquare60(scr, x, y)) {
                                  // Tính tọa độ thế giới tương ứng
                                  val gridDx = round((fx - px) / tileSize).toInt()
                                  val gridDy = round((fy - py) / tileSize).toInt()
                                  val wX = cX + gridDx
                                  val wY = cY + gridDy

                                  if (wX == cX && wY == cY) continue
                                  if (minedTiles.containsKey(Pair(wX, wY))) continue
                                  if (abs(wX - hX) > 20 || abs(wY - hY) > 20) continue

                                  // Gom cụm tránh trùng ô
                                  if (found.none { it.wX == wX && it.wY == wY }) {
                                      found.add(TargetItem(PointF(fx, fy), wX, wY))
                                  }
                              }
                          }
                      }
                  }
                  // Sắp xếp các ô gần nhân vật nhất lên đầu hàng đợi
                  found.sortBy { hypot((it.screenPt.x - px).toDouble(), (it.screenPt.y - py).toDouble()) }
                  return found.take(10)
              }

              // KIỂM TRA ĐÃ VỠ Ô LỘ CỎ XANH CHƯA
              private fun isTileBrokenToGrass(scr: Bitmap, px: Float, py: Float): Boolean {
                  val ix = px.toInt().coerceIn(20, scr.width - 21)
                  val iy = py.toInt().coerceIn(20, scr.height - 21)
                  val pts = arrayOf(Pair(ix - 18, iy), Pair(ix + 18, iy), Pair(ix, iy - 18), Pair(ix, iy + 18))
                  var grassCount = 0
                  for (pt in pts) {
                      val c = scr.getPixel(pt.first, pt.second)
                      val r = c shr 16 and 0xFF; val g = c shr 8 and 0xFF; val b = c and 0xFF
                      if (g > r + 16 && g > b + 16) grassCount++
                  }
                  return grassCount >= 3
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopCompletely()
                  inst = null
              }
          }

          class FloatingService : Service() {
              companion object { var inst: FloatingService? = null }
              private lateinit var wm: WindowManager
              private lateinit var rootContainer: LinearLayout
              private lateinit var miniBubble: TextView
              private lateinit var menuCard: LinearLayout
              private lateinit var joyView: TextView
              private lateinit var hudView: TrackingOverlayView

              private var sW = 720; private var sH = 1280

              override fun onBind(i: Intent?): IBinder? = null

              fun updateHUDList(tiles: List<VisualTile>, px: Float, py: Float, banner: String) {
                  if (::hudView.isInitialized) hudView.updateDisplay(tiles, px, py, banner)
              }

              private fun killAppAndExit() {
                  try { CaptureService.inst?.stopCompletely() } catch (_: Exception) {}
                  try {
                      if (::hudView.isInitialized && hudView.parent != null) wm.removeView(hudView)
                      if (::rootContainer.isInitialized && rootContainer.parent != null) wm.removeView(rootContainer)
                      if (::joyView.isInitialized && joyView.parent != null) wm.removeView(joyView)
                  } catch (_: Exception) {}
                  stopSelf(); android.os.Process.killProcess(android.os.Process.myPid())
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val dm = resources.displayMetrics
                  sW = dm.widthPixels; sH = dm.heightPixels

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                  hudView = TrackingOverlayView(this)
                  wm.addView(hudView, WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, type,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ))

                  rootContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  miniBubble = TextView(this).apply {
                      text = "💎"; textSize = 20f; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#E6212121")); setStroke(2, Color.parseColor("#40C4FF")) }
                      visibility = View.GONE
                  }
                  rootContainer.addView(miniBubble, LinearLayout.LayoutParams(95, 95))

                  menuCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(12, 10, 12, 10)
                      background = GradientDrawable().apply { cornerRadius = 24f; setColor(Color.parseColor("#F21E1E24")); setStroke(2, Color.parseColor("#374151")) }
                  }

                  fun createItemBtn(title: String, col: Int): Button {
                      return Button(this).apply {
                          text = title; textSize = 12f; setTextColor(Color.WHITE)
                          background = GradientDrawable().apply { cornerRadius = 16f; setColor(col) }
                          setPadding(16, 6, 16, 6)
                      }
                  }

                  val headerRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val titleTv = TextView(this).apply { text = "KHOBAU HUD 1-10"; textSize = 11f; setTextColor(Color.parseColor("#9CA3AF")); setPadding(6, 0, 16, 0) }
                  val btnMinimize = Button(this).apply {
                      text = "▲ Thu"; textSize = 10f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { cornerRadius = 12f; setColor(Color.parseColor("#4B5563")) }
                  }
                  val btnClose = Button(this).apply {
                      text = "✕"; textSize = 10f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { cornerRadius = 12f; setColor(Color.parseColor("#374151")) }
                  }
                  headerRow.addView(titleTv, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  headerRow.addView(btnMinimize, LinearLayout.LayoutParams(95, 55).apply { marginEnd = 6 })
                  headerRow.addView(btnClose, LinearLayout.LayoutParams(65, 55))

                  val bStart = createItemBtn("▶ START AUTO", Color.parseColor("#059669"))
                  val bHome = createItemBtn("🎯 ĐẶT LẠI GỐC", Color.parseColor("#4F46E5"))
                  val bJoy = createItemBtn("🕹 ĐẶT JOYSTICK", Color.parseColor("#0891B2"))
                  val bHudToggle = createItemBtn("👁 KHUNG: BẬT", Color.parseColor("#2563EB"))

                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 68).apply { topMargin = 8 }
                  menuCard.addView(headerRow)
                  menuCard.addView(bStart, lp); menuCard.addView(bHome, lp); menuCard.addView(bJoy, lp); menuCard.addView(bHudToggle, lp)
                  rootContainer.addView(menuCard, LinearLayout.LayoutParams(260, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val pRoot = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 30; y = 140
                  }
                  wm.addView(rootContainer, pRoot)

                  val pJoy = WindowManager.LayoutParams(120, 120, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (CaptureService.inst?.joyX?.toInt() ?: (sW / 2)) - 60
                      y = (CaptureService.inst?.joyY?.toInt() ?: (sH * 64 / 100)) - 60
                  }
                  joyView = TextView(this).apply {
                      text = "JOY\n(Chốt)"; gravity = Gravity.CENTER; textSize = 11f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#B300E676")) }
                  }

                  btnMinimize.setOnClickListener { menuCard.visibility = View.GONE; miniBubble.visibility = View.VISIBLE }
                  miniBubble.setOnClickListener { miniBubble.visibility = View.GONE; menuCard.visibility = View.VISIBLE }

                  bStart.setOnClickListener {
                      val a = CaptureService.inst?.toggleRun() ?: false
                      bStart.text = if (a) "⏹ STOP AUTO" else "▶ START AUTO"
                      (bStart.background as? GradientDrawable)?.setColor(if (a) Color.parseColor("#D97706") else Color.parseColor("#059669"))
                  }

                  bHome.setOnClickListener { CaptureService.inst?.resetHomeManually() }

                  bJoy.setOnClickListener {
                      pJoy.x = (CaptureService.inst?.joyX?.toInt() ?: (sW / 2)) - 60
                      pJoy.y = (CaptureService.inst?.joyY?.toInt() ?: (sH * 64 / 100)) - 60
                      if (joyView.parent == null) wm.addView(joyView, pJoy) else wm.removeView(joyView)
                  }
                  joyView.setOnClickListener {
                      val loc = IntArray(2); joyView.getLocationOnScreen(loc)
                      CaptureService.inst?.joyX = loc[0] + joyView.width / 2f
                      CaptureService.inst?.joyY = loc[1] + joyView.height / 2f
                      Toast.makeText(this, "Đã chốt Joystick!", Toast.LENGTH_SHORT).show()
                      if (joyView.parent != null) wm.removeView(joyView)
                  }

                  bHudToggle.setOnClickListener {
                      hudView.isHudVisible = !hudView.isHudVisible
                      bHudToggle.text = if (hudView.isHudVisible) "👁 KHUNG: BẬT" else "Ø KHUNG: TẮT"
                      (bHudToggle.background as? GradientDrawable)?.setColor(if (hudView.isHudVisible) Color.parseColor("#2563EB") else Color.parseColor("#4B5563"))
                      hudView.postInvalidate()
                  }

                  btnClose.setOnClickListener { killAppAndExit() }

                  fun drag(v: View, p: WindowManager.LayoutParams, targetView: View) {
                      var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { ix = p.x; iy = p.y; tx = e.rawX; ty = e.rawY; false }
                              MotionEvent.ACTION_MOVE -> {
                                  p.x = ix + (e.rawX - tx).toInt()
                                  p.y = iy + (e.rawY - ty).toInt()
                                  wm.updateViewLayout(targetView, p)
                                  true
                              }
                              else -> false
                          }
                      }
                  }
                  drag(headerRow, pRoot, rootContainer); drag(miniBubble, pRoot, rootContainer); drag(joyView, pJoy, joyView)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  killAppAndExit()
                  inst = null
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-v6.3-HUD10-APK
          path: app/build/outputs/apk/debug/*.apk
