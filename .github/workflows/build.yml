name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tao Code Fix Android 14
        run: |
          mkdir -p app/src/main/java/com/example/autoimagebot/service
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/xml

          # 1. settings & build root
          echo "rootProject.name = 'Khobaubot'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 2. app/build.gradle (targetSdk 33 tranh loi chan Android 14)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.autoimagebot'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.autoimagebot"
                  minSdk 24
                  targetSdk 33
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 3. Res & Config
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">KhobauBot</string>
              <string name="accessibility_desc">Ho tro auto bot</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="20dp">
              <Button
                  android:id="@+id/btn_start"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="BAT NUT NOI &amp; QUYEN QUET" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_floating_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/layout_root"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="#DD1E1E1E"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:padding="6dp">
              <TextView
                  android:id="@+id/tv_drag"
                  android:layout_width="30dp"
                  android:layout_height="36dp"
                  android:gravity="center"
                  android:text=":::"
                  android:textColor="#FFF" />
              <Button
                  android:id="@+id/btn_toggle"
                  android:layout_width="wrap_content"
                  android:layout_height="36dp"
                  android:background="#2E7D32"
                  android:text="START"
                  android:textColor="#FFF"
                  android:textSize="12sp" />
              <Button
                  android:id="@+id/btn_close"
                  android:layout_width="36dp"
                  android:layout_height="36dp"
                  android:background="#C62828"
                  android:text="X"
                  android:textColor="#FFF"
                  android:layout_marginStart="4dp" />
          </LinearLayout>
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.autoimagebot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="KhobauBot"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".service.BotAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <service android:name=".service.FloatingOverlayService" android:exported="false" />
                  <service
                      android:name=".service.ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 5. Kotlin Sources (Fix Android 14 Callback & FGS Type)
          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/service/BotAccessibilityService.kt
          package com.example.autoimagebot.service
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.sin

          class BotAccessibilityService : AccessibilityService() {
              companion object { var instance: BotAccessibilityService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onDestroy() { super.onDestroy(); instance = null }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun moveToward(joyX: Float, joyY: Float, targetX: Float, targetY: Float) {
                  val angle = atan2((targetY - joyY).toDouble(), (targetX - joyX).toDouble())
                  val destX = joyX + (120f * cos(angle)).toFloat()
                  val destY = joyY + (120f * sin(angle)).toFloat()
                  val path = Path().apply { moveTo(joyX, joyY); lineTo(destX, destY) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 400)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/service/ScreenCaptureService.kt
          package com.example.autoimagebot.service
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*

          class ScreenCaptureService : Service() {
              companion object { var instance: ScreenCaptureService? = null }
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var isRunning = false
              private var job: Job? = null
              private var w = 720
              private var h = 1280
              private var density = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  wm.defaultDisplay.getRealMetrics(metrics)
                  w = metrics.widthPixels
                  h = metrics.heightPixels
                  density = metrics.densityDpi

                  val channelId = "screen_cap_ch"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(channelId, "Cap Service", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  }
                  val notif = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("KhobauBot Đang chạy")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()

                  // Fix Android 14 FGS Type
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(101, notif)
                  }
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("CODE", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val data = intent?.getParcelableExtra<Intent>("DATA")
                  if (code == Activity.RESULT_OK && data != null) {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mediaProjection = mpm.getMediaProjection(code, data)
                      // Fix Android 14 bat buoc Callback truoc khi tao VirtualDisplay
                      mediaProjection?.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))

                      imageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      virtualDisplay = mediaProjection?.createVirtualDisplay("Cap", w, h, density,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader?.surface, null, null)
                  }
                  return START_STICKY
              }

              fun startBot() {
                  isRunning = true
                  job = CoroutineScope(Dispatchers.Default).launch {
                      while (isRunning) {
                          val img = imageReader?.acquireLatestImage()
                          if (img != null) {
                              img.close()
                              // Mo phong keo joystick ve phia truoc
                              BotAccessibilityService.instance?.moveToward(w * 0.25f, h * 0.75f, w * 0.25f, h * 0.60f)
                          }
                          delay(500)
                      }
                  }
              }

              fun stopBot() { isRunning = false; job?.cancel() }

              override fun onDestroy() {
                  super.onDestroy()
                  stopBot()
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
                  instance = null
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/service/FloatingOverlayService.kt
          package com.example.autoimagebot.service
          import android.annotation.SuppressLint
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.Button
          import android.widget.TextView
          import com.example.autoimagebot.R

          class FloatingOverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var v: View
              private lateinit var p: WindowManager.LayoutParams
              private var running = false

              override fun onBind(intent: Intent?): IBinder? = null

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  v = LayoutInflater.from(this).inflate(R.layout.layout_floating_widget, null)
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  p = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100; y = 200
                  }
                  wm.addView(v, p)
                  val btn = v.findViewById<Button>(R.id.btn_toggle)
                  btn.setOnClickListener {
                      running = !running
                      if (running) {
                          btn.text = "STOP"; btn.setBackgroundColor(Color.RED)
                          ScreenCaptureService.instance?.startBot()
                      } else {
                          btn.text = "START"; btn.setBackgroundColor(Color.parseColor("#2E7D32"))
                          ScreenCaptureService.instance?.stopBot()
                      }
                  }
                  v.findViewById<Button>(R.id.btn_close).setOnClickListener { stopSelf() }

                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  v.findViewById<TextView>(R.id.tv_drag).setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = p.x; iy = p.y; tx = e.rawX; ty = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> { p.x = ix + (e.rawX - tx).toInt(); p.y = iy + (e.rawY - ty).toInt(); wm.updateViewLayout(v, p); true }
                          else -> false
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  ScreenCaptureService.instance?.stopBot()
                  if (::v.isInitialized) wm.removeView(v)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/autoimagebot/MainActivity.kt
          package com.example.autoimagebot
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.example.autoimagebot.service.FloatingOverlayService
          import com.example.autoimagebot.service.ScreenCaptureService

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<Button>(R.id.btn_start).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Cap quyen cua so noi!", Toast.LENGTH_SHORT).show()
                          startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1)
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2 && res == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, ScreenCaptureService::class.java).apply {
                          putExtra("CODE", res)
                          putExtra("DATA", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                      startService(Intent(this, FloatingOverlayService::class.java))
                      moveTaskToBack(true)
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-v1.1-APK
          path: app/build/outputs/apk/debug/*.apk
          
