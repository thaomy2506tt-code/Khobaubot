name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tao Code KhobauBot HUD Fix
        run: |
          mkdir -p app/src/main/java/com/bot app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Khobaubot"
          include ':app'
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.bot'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.bot'
                  minSdk 24
                  targetSdk 33
                  versionCode 9
                  versionName '1.9'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/acc.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="KhobauBot" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.bot.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name="com.bot.BotAccService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
                  <service android:name="com.bot.FloatingService" android:exported="false"/>
                  <service android:name="com.bot.CaptureService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/bot/App.kt
          package com.bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import kotlin.math.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val btn = Button(this).apply { text = "BẬT KHOBAUBOT AUTO"; textSize = 18f }
                  setContentView(btn)
                  btn.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Cấp quyền Cửa sổ nổi!", Toast.LENGTH_SHORT).show()
                          startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1)
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2 && res == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java).apply {
                          putExtra("C", res)
                          putExtra("D", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                      startService(Intent(this, FloatingService::class.java))
                      moveTaskToBack(true)
                  }
              }
          }

          class BotAccService : AccessibilityService() {
              companion object { var inst: BotAccService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); inst = this }
              override fun onDestroy() { super.onDestroy(); inst = null }
              override fun onAccessibilityEvent(e: android.view.accessibility.AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun walkToward(jx: Float, jy: Float, targetX: Float, targetY: Float, cx: Float, cy: Float, durationMs: Long = 180) {
                  val angle = atan2((targetY - cy).toDouble(), (targetX - cx).toDouble())
                  val destX = jx + (115f * cos(angle)).toFloat()
                  val destY = jy + (115f * sin(angle)).toFloat()
                  val path = Path().apply { moveTo(jx, jy); lineTo(destX, destY) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, durationMs)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }
          }

          class TrackingOverlayView(context: Context) : View(context) {
              private var monsterRect: RectF? = null
              private var tileRect: RectF? = null
              private var hue = 0f
              private val boxPaint = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 7f; isAntiAlias = true }
              private val textPaint = Paint().apply { textSize = 28f; isFakeBoldText = true; isAntiAlias = true; setShadowLayer(4f, 2f, 2f, Color.BLACK) }

              fun updateTargets(m: RectF?, t: RectF?) {
                  monsterRect = m
                  tileRect = t
                  hue = (hue + 15f) % 360f
                  postInvalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  tileRect?.let { r ->
                      val color = Color.HSVToColor(floatArrayOf(hue, 1f, 1f))
                      boxPaint.color = color; textPaint.color = color
                      canvas.drawRoundRect(r, 10f, 10f, boxPaint)
                      canvas.drawText("Ô ĐẬP", r.left, max(r.top - 10f, 32f), textPaint)
                  }
                  monsterRect?.let { r ->
                      val color = Color.parseColor("#FF1744")
                      boxPaint.color = color; textPaint.color = color
                      canvas.drawRoundRect(r, 10f, 10f, boxPaint)
                      canvas.drawText("QUÁI", r.left, max(r.top - 10f, 32f), textPaint)
                  }
              }
          }

          class CaptureService : Service() {
              companion object { var inst: CaptureService? = null }
              private var mp: MediaProjection? = null
              private var reader: ImageReader? = null
              private var lastBmp: Bitmap? = null

              var targetBmp: Bitmap? = null
              var monsterBmp: Bitmap? = null

              var joyX = 250f
              var joyY = 850f
              var offsetX = 0f
              var offsetY = 0f
              private val maxTileRadius = 20
              private var savedTileHomeX: Float? = null
              private var savedTileHomeY: Float? = null

              private var running = false
              private var job: Job? = null
              private var sW = 720
              private var sH = 1280

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  val dm = resources.displayMetrics
                  sW = dm.widthPixels; sH = dm.heightPixels
                  joyX = sW * 0.22f; joyY = sH * 0.75f

                  val chId = "bot_cap_channel_v19"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val m = getSystemService(NotificationManager::class.java)
                      m?.createNotificationChannel(NotificationChannel(chId, "Farm Service", NotificationManager.IMPORTANCE_LOW))
                  }
                  val notif = NotificationCompat.Builder(this, chId).setContentTitle("KhobauBot HUD Active").setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(109, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(109, notif)
                  }
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("C", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("D")
                  if (code == Activity.RESULT_OK && data != null) {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mp = mpm.getMediaProjection(code, data)
                      mp?.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
                      reader = ImageReader.newInstance(sW, sH, PixelFormat.RGBA_8888, 2)
                      mp?.createVirtualDisplay("VDisp", sW, sH, resources.displayMetrics.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader?.surface, null, null)
                  }
                  return START_STICKY
              }

              fun resetAnchor() {
                  offsetX = 0f; offsetY = 0f; savedTileHomeX = null; savedTileHomeY = null
                  Toast.makeText(this, "Đã chốt GỐC 20 Ô!", Toast.LENGTH_SHORT).show()
              }

              fun getLatestBitmap(): Bitmap? {
                  val img = reader?.acquireLatestImage() ?: return lastBmp
                  try {
                      val plane = img.planes[0]
                      val buf = plane.buffer
                      val pStride = plane.pixelStride
                      val rStride = plane.rowStride
                      val pad = rStride - pStride * sW
                      val bmp = Bitmap.createBitmap(sW + pad / pStride, sH, Bitmap.Config.ARGB_8888)
                      bmp.copyPixelsFromBuffer(buf)
                      lastBmp = if (pad > 0) Bitmap.createBitmap(bmp, 0, 0, sW, sH) else bmp
                  } catch (_: Exception) {}
                  finally { img.close() }
                  return lastBmp
              }

              fun cropSample(x: Int, y: Int, w: Int, h: Int, isMonster: Boolean): Boolean {
                  val screen = getLatestBitmap() ?: return false
                  val rx = x.coerceIn(0, screen.width - 1)
                  val ry = y.coerceIn(0, screen.height - 1)
                  val rw = w.coerceAtMost(screen.width - rx)
                  val rh = h.coerceAtMost(screen.height - ry)
                  if (rw > 10 && rh > 10) {
                      val cropped = Bitmap.createBitmap(screen, rx, ry, rw, rh)
                      if (isMonster) monsterBmp = cropped else targetBmp = cropped
                      return true
                  }
                  return false
              }

              fun toggleRun(): Boolean {
                  running = !running
                  if (running) {
                      if (targetBmp == null && monsterBmp == null) {
                          Toast.makeText(this, "Lưu MẪU Ô hoặc MẪU QUÁI trước!", Toast.LENGTH_SHORT).show()
                          running = false
                          return false
                      }
                      resetAnchor()
                      job = CoroutineScope(Dispatchers.Default).launch {
                          val cx = sW / 2f
                          val cy = sH / 2f
                          while (running) {
                              val scr = getLatestBitmap()
                              if (scr == null) { delay(120); continue }

                              val tileSize = (targetBmp?.width ?: 50).toFloat().coerceAtLeast(40f)
                              val maxDistancePx = maxTileRadius * tileSize
                              val currentDistFromHome = hypot(offsetX, offsetY)

                              if (currentDistFromHome >= maxDistancePx) {
                                  FloatingService.inst?.updateHUD(null, null)
                                  val backAngle = atan2(-offsetY.toDouble(), -offsetX.toDouble())
                                  val backStep = tileSize * 0.7f
                                  val backX = cx + (backStep * cos(backAngle)).toFloat()
                                  val backY = cy + (backStep * sin(backAngle)).toFloat()
                                  BotAccService.inst?.walkToward(joyX, joyY, backX, backY, cx, cy, 250)
                                  offsetX += (backStep * cos(backAngle)).toFloat()
                                  offsetY += (backStep * sin(backAngle)).toFloat()
                                  delay(260)
                                  continue
                              }

                              var monsterTarget: PointF? = null
                              var mBox: RectF? = null
                              if (monsterBmp != null) {
                                  monsterTarget = scanTarget(scr, monsterBmp!!, cx, cy, maxDistancePx, 60)
                                  if (monsterTarget != null) {
                                      val mw = monsterBmp!!.width.toFloat()
                                      val mh = monsterBmp!!.height.toFloat()
                                      mBox = RectF(monsterTarget.x - mw / 2, monsterTarget.y - mh / 2, monsterTarget.x + mw / 2, monsterTarget.y + mh / 2)
                                  }
                              }

                              if (monsterTarget != null) {
                                  FloatingService.inst?.updateHUD(mBox, null)
                                  val dist = hypot(monsterTarget.x - cx, monsterTarget.y - cy)
                                  val angle = atan2((monsterTarget.y - cy).toDouble(), (monsterTarget.x - cx).toDouble())
                                  val step = if (dist > 40f) tileSize * 0.65f else tileSize * 0.35f
                                  BotAccService.inst?.walkToward(joyX, joyY, monsterTarget.x, monsterTarget.y, cx, cy, 180)
                                  offsetX += (step * cos(angle)).toFloat()
                                  offsetY += (step * sin(angle)).toFloat()
                                  delay(180)
                                  continue
                              }

                              var tileTarget: PointF? = null
                              if (savedTileHomeX != null && savedTileHomeY != null) {
                                  val screenTargetX = cx + (savedTileHomeX!! - offsetX)
                                  val screenTargetY = cy + (savedTileHomeY!! - offsetY)
                                  if (screenTargetX in 50f..(sW - 50f) && screenTargetY in 50f..(sH - 50f)) {
                                      tileTarget = PointF(screenTargetX, screenTargetY)
                                  } else {
                                      savedTileHomeX = null; savedTileHomeY = null
                                  }
                              }

                              if (tileTarget == null && targetBmp != null) {
                                  tileTarget = scanTarget(scr, targetBmp!!, cx, cy, maxDistancePx, 50)
                                  if (tileTarget != null) {
                                      savedTileHomeX = offsetX + (tileTarget.x - cx)
                                      savedTileHomeY = offsetY + (tileTarget.y - cy)
                                  }
                              }

                              if (tileTarget != null) {
                                  val tw = (targetBmp?.width ?: 45).toFloat()
                                  val th = (targetBmp?.height ?: 45).toFloat()
                                  val tBox = RectF(tileTarget.x - tw / 2, tileTarget.y - th / 2, tileTarget.x + tw / 2, tileTarget.y + th / 2)
                                  FloatingService.inst?.updateHUD(null, tBox)

                                  val dist = hypot(tileTarget.x - cx, tileTarget.y - cy)
                                  if (dist <= (tileSize * 0.35f).coerceAtLeast(28f)) {
                                      delay(220)
                                  } else {
                                      val angle = atan2((tileTarget.y - cy).toDouble(), (tileTarget.x - cx).toDouble())
                                      val step = tileSize * 0.65f
                                      BotAccService.inst?.walkToward(joyX, joyY, tileTarget.x, tileTarget.y, cx, cy, 200)
                                      offsetX += (step * cos(angle)).toFloat()
                                      offsetY += (step * sin(angle)).toFloat()
                                      delay(210)
                                  }
                              } else {
                                  savedTileHomeX = null; savedTileHomeY = null
                                  FloatingService.inst?.updateHUD(null, null)
                                  delay(300)
                              }
                          }
                      }
                  } else {
                      job?.cancel()
                      FloatingService.inst?.updateHUD(null, null)
                  }
                  return running
              }

              private fun scanTarget(screen: Bitmap, tpl: Bitmap, cx: Float, cy: Float, maxPx: Float, maxDiff: Int): PointF? {
                  val scale = 0.35f
                  val sw = (screen.width * scale).toInt()
                  val sh = (screen.height * scale).toInt()
                  val tw = (tpl.width * scale).toInt().coerceAtLeast(6)
                  val th = (tpl.height * scale).toInt().coerceAtLeast(6)
                  if (tw >= sw || th >= sh) return null

                  val sBmp = Bitmap.createScaledBitmap(screen, sw, sh, false)
                  val tBmp = Bitmap.createScaledBitmap(tpl, tw, th, false)
                  val sp = IntArray(sw * sh); val tp = IntArray(tw * th)
                  sBmp.getPixels(sp, 0, sw, 0, 0, sw, sh)
                  tBmp.getPixels(tp, 0, tw, 0, 0, tw, th)

                  var minDistanceSq = Double.MAX_VALUE
                  var bestPoint: PointF? = null
                  val step = 4
                  val totalSamples = (tw / step) * (th / step)
                  if (totalSamples == 0) return null

                  for (y in 0 until (sh - th) step (step * 2)) {
                      for (x in 0 until (sw - tw) step (step * 2)) {
                          var diff = 0L
                          for (ty in 0 until th step step) {
                              for (tx in 0 until tw step step) {
                                  val c1 = sp[(y + ty) * sw + (x + tx)]
                                  val c2 = tp[ty * tw + tx]
                                  diff += abs((c1 shr 16 and 0xFF) - (c2 shr 16 and 0xFF)) +
                                          abs((c1 shr 8 and 0xFF) - (c2 shr 8 and 0xFF)) +
                                          abs((c1 and 0xFF) - (c2 and 0xFF))
                              }
                          }
                          if (diff / (totalSamples * 3) < maxDiff) {
                              val targetX = (x + tw / 2f) / scale
                              val targetY = (y + th / 2f) / scale
                              val distHome = hypot(offsetX + (targetX - cx), offsetY + (targetY - cy))
                              if (distHome <= maxPx) {
                                  val dx = (targetX - cx).toDouble()
                                  val dy = (targetY - cy).toDouble()
                                  val distChar = dx * dx + dy * dy
                                  if (distChar < minDistanceSq) {
                                      minDistanceSq = distChar
                                      bestPoint = PointF(targetX, targetY)
                                  }
                              }
                          }
                      }
                  }
                  return bestPoint
              }

              override fun onDestroy() {
                  super.onDestroy()
                  running = false; job?.cancel(); FloatingService.inst?.updateHUD(null, null)
                  mp?.stop(); reader?.close(); inst = null
              }
          }

          class FloatingService : Service() {
              companion object { var inst: FloatingService? = null }
              private lateinit var wm: WindowManager
              private lateinit var barView: LinearLayout
              private lateinit var cropBox: LinearLayout
              private lateinit var btnSaveCrop: Button
              private lateinit var joyView: TextView
              private lateinit var hudView: TrackingOverlayView
              private var isCroppingMonster = false

              override fun onBind(intent: Intent?): IBinder? = null

              fun updateHUD(mRect: RectF?, tRect: RectF?) {
                  if (::hudView.isInitialized) hudView.updateTargets(mRect, tRect)
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                  hudView = TrackingOverlayView(this)
                  val pHud = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, type,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(hudView, pHud)

                  barView = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#EE1E1E1E"))
                      setPadding(6, 6, 6, 6)
                  }

                  val btnStart = Button(this).apply { text = "START"; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#2E7D32")) }
                  val btnGoc = Button(this).apply { text = "GỐC"; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#7B1FA2")) }
                  val btnCropTile = Button(this).apply { text = "Ô ĐẤT"; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#1565C0")) }
                  val btnCropMonster = Button(this).apply { text = "QUÁI"; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#D84315")) }
                  val btnJoy = Button(this).apply { text = "JOY"; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#00897B")) }
                  val btnClose = Button(this).apply { text = "X"; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#C62828")) }

                  barView.addView(btnStart); barView.addView(btnGoc); barView.addView(btnCropTile)
                  barView.addView(btnCropMonster); barView.addView(btnJoy); barView.addView(btnClose)

                  val pBar = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 30; y = 100
                  }
                  wm.addView(barView, pBar)

                  val pCrop = WindowManager.LayoutParams(180, 180, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 250; y = 300
                  }
                  cropBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#4D2196F3")); gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  }
                  btnSaveCrop = Button(this).apply { text = "LƯU"; setBackgroundColor(Color.YELLOW); setTextColor(Color.BLACK) }
                  cropBox.addView(btnSaveCrop)

                  val pJoy = WindowManager.LayoutParams(140, 140, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 120; y = 750
                  }
                  joyView = TextView(this).apply {
                      text = "JOY\n(Chốt)"; gravity = Gravity.CENTER; setTextColor(Color.WHITE); setBackgroundColor(Color.parseColor("#AA00E676"))
                  }

                  btnStart.setOnClickListener {
                      val active = CaptureService.inst?.toggleRun() ?: false
                      btnStart.text = if (active) "STOP" else "START"
                      btnStart.setBackgroundColor(if (active) Color.RED else Color.parseColor("#2E7D32"))
                  }
                  btnGoc.setOnClickListener { CaptureService.inst?.resetAnchor() }
                  btnCropTile.setOnClickListener {
                      isCroppingMonster = false; cropBox.setBackgroundColor(Color.parseColor("#4D2196F3"))
                      btnSaveCrop.text = "LƯU Ô ĐẤT"
                      if (cropBox.parent == null) wm.addView(cropBox, pCrop)
                  }
                  btnCropMonster.setOnClickListener {
                      isCroppingMonster = true; cropBox.setBackgroundColor(Color.parseColor("#55FF1744"))
                      btnSaveCrop.text = "LƯU QUÁI"
                      if (cropBox.parent == null) wm.addView(cropBox, pCrop)
                  }
                  btnSaveCrop.setOnClickListener {
                      val loc = IntArray(2); cropBox.getLocationOnScreen(loc)
                      val ok = CaptureService.inst?.cropSample(loc[0], loc[1], cropBox.width, cropBox.height, isCroppingMonster) ?: false
                      if (ok) Toast.makeText(this, if (isCroppingMonster) "Đã lưu MẪU QUÁI!" else "Đã lưu MẪU Ô ĐẤT!", Toast.LENGTH_SHORT).show()
                      if (cropBox.parent != null) wm.removeView(cropBox)
                  }
                  btnJoy.setOnClickListener { if (joyView.parent == null) wm.addView(joyView, pJoy) else wm.removeView(joyView) }
                  joyView.setOnClickListener {
                      val loc = IntArray(2); joyView.getLocationOnScreen(loc)
                      CaptureService.inst?.joyX = loc[0] + joyView.width / 2f
                      CaptureService.inst?.joyY = loc[1] + joyView.height / 2f
                      Toast.makeText(this, "Đã chốt Joystick!", Toast.LENGTH_SHORT).show()
                      if (joyView.parent != null) wm.removeView(joyView)
                  }
                  btnClose.setOnClickListener { stopSelf() }

                  fun setupDrag(v: View, p: WindowManager.LayoutParams) {
                      var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { ix = p.x; iy = p.y; tx = e.rawX; ty = e.rawY; false }
                              MotionEvent.ACTION_MOVE -> { p.x = ix + (e.rawX - tx).toInt(); p.y = iy + (e.rawY - ty).toInt(); wm.updateViewLayout(v, p); true }
                              else -> false
                          }
                      }
                  }
                  setupDrag(barView, pBar); setupDrag(cropBox, pCrop); setupDrag(joyView, pJoy)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::hudView.isInitialized && hudView.parent != null) wm.removeView(hudView)
                  if (::barView.isInitialized && barView.parent != null) wm.removeView(barView)
                  if (::cropBox.isInitialized && cropBox.parent != null) wm.removeView(cropBox)
                  if (::joyView.isInitialized && joyView.parent != null) wm.removeView(joyView)
                  inst = null
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-v1.9-APK
          path: app/build/outputs/apk/debug/*.apk
