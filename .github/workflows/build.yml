name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tao Cau Hinh He Thong
        run: |
          mkdir -p app/src/main/java/com/bot app/src/main/res/xml
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'Khobaubot'; include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo -e "plugins {\n id 'com.android.application' version '8.2.2' apply false\n id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}" > build.gradle

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.bot'; compileSdk 34
              defaultConfig { applicationId 'com.bot'; minSdk 24; targetSdk 33; versionCode 34; versionName '4.4' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          echo '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" />' > app/src/main/res/xml/acc.xml

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="KhobauBot" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name="com.bot.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name="com.bot.BotAccService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
                  <service android:name="com.bot.FloatingService" android:exported="false"/>
                  <service android:name="com.bot.CaptureService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF
      - name: Tao Code App Va Build APK
        run: |
          cat << 'EOF' > app/src/main/java/com/bot/App.kt
          package com.bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import kotlin.math.*

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(40, 40, 40, 40) }
                  val bAcc = Button(this).apply { text = "1. BẬT TRỢ NĂNG (BẮT BUỘC)"; setBackgroundColor(Color.parseColor("#E65100")); setTextColor(Color.WHITE) }
                  val bStart = Button(this).apply { text = "2. KHỞI ĐỘNG KHOBAUBOT"; setBackgroundColor(Color.parseColor("#2E7D32")); setTextColor(Color.WHITE) }
                  l.addView(bAcc); l.addView(bStart); setContentView(l)

                  bAcc.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Tìm KhobauBot và Gạt BẬT!", Toast.LENGTH_LONG).show()
                  }
                  bStart.setOnClickListener {
                      if (BotAccService.inst == null) {
                          Toast.makeText(this, "Vui lòng bật quyền Trợ năng ở nút 1 trước!", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Cấp quyền Cửa sổ nổi!", Toast.LENGTH_SHORT).show()
                          startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1)
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  }
              }
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2 && res == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java).apply { putExtra("C", res); putExtra("D", data) }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                      startService(Intent(this, FloatingService::class.java))
                      moveTaskToBack(true)
                  }
              }
          }

          class BotAccService : AccessibilityService() {
              companion object { var inst: BotAccService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); inst = this }
              override fun onDestroy() { super.onDestroy(); inst = null }
              override fun onAccessibilityEvent(e: android.view.accessibility.AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun walkToward(jx: Float, jy: Float, tx: Float, ty: Float, px: Float, py: Float, dMs: Long = 230) {
                  val angle = atan2((ty - py).toDouble(), (tx - px).toDouble())
                  val p = Path().apply { moveTo(jx, jy); lineTo(jx + (120f * cos(angle)).toFloat(), jy + (120f * sin(angle)).toFloat()) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, dMs)).build(), null, null)
              }
          }

          class TrackingOverlayView(ctx: Context) : View(ctx) {
              var isHudVisible = true
              private var mR: RectF? = null
              private var tR: RectF? = null
              private var stateText: String = ""
              private var hue = 0f

              private val pBox = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 3.5f; isAntiAlias = true }
              private val pTxt = Paint().apply { textSize = 21f; isFakeBoldText = true; isAntiAlias = true; setShadowLayer(3f, 1f, 1f, Color.BLACK); color = Color.WHITE }

              fun update(m: RectF?, t: RectF?, st: String) {
                  mR = m; tR = t; stateText = st
                  hue = (hue + 16f) % 360f; postInvalidate()
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  if (!isHudVisible) return

                  tR?.let { r ->
                      val col = Color.HSVToColor(floatArrayOf(hue, 0.9f, 1f))
                      pBox.color = col; c.drawRoundRect(r, 6f, 6f, pBox)
                      val ty = if (r.top - 8f > 30f) r.top - 8f else r.bottom + 26f
                      c.drawText(stateText, r.left, ty, pTxt)
                  }

                  mR?.let { r ->
                      pBox.color = Color.parseColor("#FF1744"); c.drawRoundRect(r, 6f, 6f, pBox)
                      val ty = if (r.top - 8f > 30f) r.top - 8f else 30f
                      c.drawText("⚔ DÍ QUÁI", r.left, ty, pTxt)
                  }
              }
          }

          class CaptureService : Service() {
              companion object { var inst: CaptureService? = null }
              private var mp: MediaProjection? = null
              private var reader: ImageReader? = null
              private var lastBmp: Bitmap? = null

              var joyX = 360f
              var joyY = 820f
              var enableHuntMonster = false

              private var dispFromAnchorX = 0f
              private var dispFromAnchorY = 0f

              private var isMining = false
              private var mineTargetX = 0f
              private var mineTargetY = 0f
              private var mineStartTime = 0L
              private val skippedTiles = mutableListOf<Pair<PointF, Long>>()

              private var running = false; private var job: Job? = null
              private var sW = 720; private var sH = 1280

              private val tileW get() = sW / 12f
              private val tileH get() = sH / 18f
              private val maxSafeX get() = 7.0f * tileW
              private val maxSafeY get() = 9.0f * tileH

              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  val dm = resources.displayMetrics; sW = dm.widthPixels; sH = dm.heightPixels
                  joyX = sW * 0.5f
                  joyY = sH * 0.64f

                  val chId = "bot_v44"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val m = getSystemService(NotificationManager::class.java)
                      m?.createNotificationChannel(NotificationChannel(chId, "Bot", NotificationManager.IMPORTANCE_LOW))
                  }
                  val n = NotificationCompat.Builder(this, chId).setContentTitle("KhobauBot v4.4 Active").setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) startForeground(134, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION) else startForeground(134, n)
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("C", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("D")
                  if (code == Activity.RESULT_OK && data != null) {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mp = mpm.getMediaProjection(code, data)
                      mp?.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
                      reader = ImageReader.newInstance(sW, sH, PixelFormat.RGBA_8888, 2)
                      mp?.createVirtualDisplay("V", sW, sH, resources.displayMetrics.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader?.surface, null, null)
                  }
                  return START_STICKY
              }

              fun resetAnchor() {
                  dispFromAnchorX = 0f; dispFromAnchorY = 0f
                  isMining = false; skippedTiles.clear()
                  Toast.makeText(this, "Đã chốt GỐC 7x9 ô tại vị trí này!", Toast.LENGTH_SHORT).show()
              }

              fun stopCompletely() {
                  running = false
                  job?.cancel()
                  try { mp?.stop() } catch (_: Exception) {}
                  try { reader?.close() } catch (_: Exception) {}
                  stopForeground(true)
                  stopSelf()
              }

              fun getScreen(): Bitmap? {
                  val img = reader?.acquireLatestImage() ?: return lastBmp
                  try {
                      val pl = img.planes[0]; val buf = pl.buffer
                      val pad = pl.rowStride - pl.pixelStride * sW
                      val bmp = Bitmap.createBitmap(sW + pad / pl.pixelStride, sH, Bitmap.Config.ARGB_8888)
                      bmp.copyPixelsFromBuffer(buf)
                      lastBmp = if (pad > 0) Bitmap.createBitmap(bmp, 0, 0, sW, sH) else bmp
                  } catch (_: Exception) {} finally { img.close() }
                  return lastBmp
              }

              fun toggleRun(): Boolean {
                  running = !running
                  if (running) {
                      if (BotAccService.inst == null) { Toast.makeText(this, "CHƯA BẬT TRỢ NĂNG!", Toast.LENGTH_LONG).show(); running = false; return false }
                      resetAnchor()
                      job = CoroutineScope(Dispatchers.Default).launch {
                          while (running) {
                              val scr = getScreen()
                              if (scr == null) { delay(80); continue }

                              val px = sW * 0.5f
                              val py = sH * 0.44f

                              // 1. SĂN QUÁI (CHỈ KHI BẬT VÀ NGOÀI BÁN KÍNH 75px)
                              if (enableHuntMonster) {
                                  val monsterPt = findMonsterSafe(scr, px, py)
                                  if (monsterPt != null) {
                                      isMining = false
                                      val mBox = RectF(monsterPt.x - 28f, monsterPt.y - 12f, monsterPt.x + 28f, monsterPt.y + 45f)
                                      FloatingService.inst?.updateHUD(mBox, null, "")
                                      BotAccService.inst?.walkToward(joyX, joyY, monsterPt.x, monsterPt.y, px, py, 230)
                                      delay(230); continue
                                  }
                              }

                              // 2. KHÓA PHẠM VI AN TOÀN QUANH GỐC (7 Ô NGANG, 9 Ô DỌC)
                              if (abs(dispFromAnchorX) >= maxSafeX || abs(dispFromAnchorY) >= maxSafeY) {
                                  isMining = false
                                  FloatingService.inst?.updateHUD(null, null, "QUAY VỀ GỐC")
                                  val backAng = atan2(-dispFromAnchorY.toDouble(), -dispFromAnchorX.toDouble())
                                  val stepMove = tileW * 0.85f
                                  BotAccService.inst?.walkToward(joyX, joyY, px + (stepMove * cos(backAng)).toFloat(), py + (stepMove * sin(backAng)).toFloat(), px, py, 260)
                                  dispFromAnchorX += (stepMove * cos(backAng)).toFloat()
                                  dispFromAnchorY += (stepMove * sin(backAng)).toFloat()
                                  delay(270); continue
                              }

                              // 3. TIẾN TRÌNH ĐẬP ĐÁ (ĐỨNG YÊN ĐẬP ĐÁ)
                              if (isMining) {
                                  val tBox = RectF(mineTargetX - 26f, mineTargetY - 26f, mineTargetX + 26f, mineTargetY + 26f)
                                  val isBroken = isTileBroken(scr, mineTargetX, mineTargetY)
                                  val isTimeout = (System.currentTimeMillis() - mineStartTime) > 4000L

                                  if (isBroken) {
                                      isMining = false
                                      FloatingService.inst?.updateHUD(null, null, "")
                                      delay(100); continue
                                  }

                                  if (isTimeout) {
                                      skippedTiles.add(Pair(PointF(mineTargetX, mineTargetY), System.currentTimeMillis()))
                                      isMining = false
                                      FloatingService.inst?.updateHUD(null, null, "")
                                      delay(100); continue
                                  }

                                  FloatingService.inst?.updateHUD(null, tBox, "⛏ ĐANG ĐẬP...")
                                  delay(250); continue
                              }

                              // 4. TIẾN TRÌNH DI CHUYỂN TỚI Ô ĐẤT GẦN NHẤT
                              val now = System.currentTimeMillis()
                              skippedTiles.removeAll { now - it.second > 10000L }

                              val target = findNearestTile(scr, px, py)
                              if (target != null) {
                                  val dist = hypot((target.x - px).toDouble(), (target.y - py).toDouble()).toFloat()
                                  val tBox = RectF(target.x - 26f, target.y - 26f, target.x + 26f, target.y + 26f)

                                  if (dist <= 38f) {
                                      isMining = true
                                      mineTargetX = target.x
                                      mineTargetY = target.y
                                      mineStartTime = System.currentTimeMillis()
                                      FloatingService.inst?.updateHUD(null, tBox, "⛏ ĐANG ĐẬP...")
                                      delay(150); continue
                                  } else {
                                      FloatingService.inst?.updateHUD(null, tBox, "▶ TIẾN VÀO Ô")
                                      val ang = atan2((target.y - py).toDouble(), (target.x - px).toDouble())
                                      val stepMove = tileW * 0.75f
                                      BotAccService.inst?.walkToward(joyX, joyY, target.x, target.y, px, py, 230)

                                      dispFromAnchorX += (stepMove * cos(ang)).toFloat()
                                      dispFromAnchorY += (stepMove * sin(ang)).toFloat()
                                      delay(240); continue
                                  }
                              } else {
                                  FloatingService.inst?.updateHUD(null, null, "CHỜ SPAWN")
                                  val distFromHome = hypot(dispFromAnchorX.toDouble(), dispFromAnchorY.toDouble()).toFloat()
                                  if (distFromHome > (tileW * 0.8f)) {
                                      val backAng = atan2(-dispFromAnchorY.toDouble(), -dispFromAnchorX.toDouble())
                                      val stepMove = tileW * 0.8f
                                      BotAccService.inst?.walkToward(joyX, joyY, px + (stepMove * cos(backAng)).toFloat(), py + (stepMove * sin(backAng)).toFloat(), px, py, 240)
                                      dispFromAnchorX += (stepMove * cos(backAng)).toFloat()
                                      dispFromAnchorY += (stepMove * sin(backAng)).toFloat()
                                  }
                                  delay(300)
                              }
                          }
                      }
                  } else {
                      job?.cancel(); FloatingService.inst?.updateHUD(null, null, "")
                  }
                  return running
              }

              private fun findMonsterSafe(scr: Bitmap, px: Float, py: Float): PointF? {
                  val startY = (sH * 0.12f).toInt(); val endY = (sH * 0.70f).toInt()
                  val startX = (sW * 0.10f).toInt(); val endX = (sW * 0.90f).toInt()
                  var minD = Double.MAX_VALUE; var best: PointF? = null

                  for (y in startY until endY step 3) {
                      for (x in startX until endX step 3) {
                          val c = scr.getPixel(x, y)
                          val r = c shr 16 and 0xFF; val g = c shr 8 and 0xFF; val b = c and 0xFF

                          if (r > 175 && g < 65 && b < 65 && (r - g) > 90 && (r - b) > 90) {
                              var redLen = 0
                              for (dx in 0..12 step 2) {
                                  if (x + dx < endX) {
                                      val cScan = scr.getPixel(x + dx, y)
                                      val rS = cScan shr 16 and 0xFF; val gS = cScan shr 8 and 0xFF
                                      if (rS > 160 && gS < 75) redLen += 2
                                  }
                              }
                              if (redLen >= 6) {
                                  val realX = (x + redLen / 2).toFloat()
                                  val realY = y + 24f

                                  if (hypot(realX - px, realY - py) < 75f) continue

                                  val dx = (realX - px).toDouble(); val dy = (realY - py).toDouble()
                                  val distChar = dx * dx + dy * dy
                                  if (distChar < minD) { minD = distChar; best = PointF(realX, realY) }
                              }
                          }
                      }
                  }
                  return best
              }

              private fun isTileColor(r: Int, g: Int, b: Int): Boolean {
                  if (g > r + 20 && g > b + 20) return false
                  if (r < 75 && g < 75 && b < 75) return false

                  val isDirt = (r in 95..185 && g in 55..135 && b in 25..105 && r > g + 12 && g > b)
                  val isStone = (r in 110..205 && g in 110..205 && b in 100..200 && abs(r - g) < 25 && abs(g - b) < 25 && r > 105)
                  val isBush = (g in 105..185 && r in 95..170 && b in 45..130 && g >= r - 12 && r > b + 10 && g > 100)
                  return isDirt || isStone || isBush
              }

              private fun isTileBroken(scr: Bitmap, sx: Float, sy: Float): Boolean {
                  val ix = sx.toInt().coerceIn(20, scr.width - 21)
                  val iy = sy.toInt().coerceIn(20, scr.height - 21)
                  val pts = arrayOf(
                      Pair(ix, iy),
                      Pair(ix - 15, iy), Pair(ix + 15, iy),
                      Pair(ix, iy - 15), Pair(ix, iy + 15)
                  )
                  var grassCount = 0
                  for (pt in pts) {
                      val c = scr.getPixel(pt.first, pt.second)
                      val r = c shr 16 and 0xFF; val g = c shr 8 and 0xFF; val b = c and 0xFF
                      if (g > r + 20 && g > b + 20) grassCount++
                  }
                  return grassCount >= 3
              }

              private fun findNearestTile(scr: Bitmap, px: Float, py: Float): PointF? {
                  val startY = (sH * 0.14f).toInt(); val endY = (sH * 0.68f).toInt()
                  val startX = (sW * 0.12f).toInt(); val endX = (sW * 0.88f).toInt()
                  var minD = Double.MAX_VALUE; var best: PointF? = null

                  for (y in startY until endY step 5) {
                      for (x in startX until endX step 5) {
                          if (hypot(x - px, y - py) < 55f) continue

                          val c = scr.getPixel(x, y)
                          val r = c shr 16 and 0xFF; val g = c shr 8 and 0xFF; val b = c and 0xFF

                          if (isTileColor(r, g, b)) {
                              val realX = x.toFloat(); val realY = y.toFloat()
                              if (skippedTiles.any { hypot(realX - it.first.x, realY - it.first.y) < 25f }) continue

                              val dx = (realX - px).toDouble(); val dy = (realY - py).toDouble()
                              val dist = dx * dx + dy * dy
                              if (dist < minD) {
                                  minD = dist
                                  best = PointF(realX, realY)
                              }
                          }
                      }
                  }
                  return best
              }

              override fun onDestroy() { super.onDestroy(); stopCompletely(); FloatingService.inst?.updateHUD(null, null, ""); inst = null }
          }

          class FloatingService : Service() {
              companion object { var inst: FloatingService? = null }
              private lateinit var wm: WindowManager
              private lateinit var rootContainer: LinearLayout
              private lateinit var miniBubble: TextView
              private lateinit var menuCard: LinearLayout
              private lateinit var joyView: TextView
              private lateinit var hudView: TrackingOverlayView

              private var sW = 720
              private var sH = 1280

              override fun onBind(i: Intent?): IBinder? = null
              fun updateHUD(m: RectF?, t: RectF?, st: String = "") {
                  if (::hudView.isInitialized) hudView.update(m, t, st)
              }

              private fun killAppAndExit() {
                  try { CaptureService.inst?.stopCompletely() } catch (_: Exception) {}
                  try {
                      if (::hudView.isInitialized && hudView.parent != null) wm.removeView(hudView)
                      if (::rootContainer.isInitialized && rootContainer.parent != null) wm.removeView(rootContainer)
                      if (::joyView.isInitialized && joyView.parent != null) wm.removeView(joyView)
                  } catch (_: Exception) {}
                  stopSelf()
                  android.os.Process.killProcess(android.os.Process.myPid())
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val dm = resources.displayMetrics
                  sW = dm.widthPixels
                  sH = dm.heightPixels

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                  hudView = TrackingOverlayView(this)
                  wm.addView(hudView, WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, type,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ))

                  rootContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  miniBubble = TextView(this).apply {
                      text = "💎"; textSize = 20f; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#E6212121")); setStroke(2, Color.parseColor("#40C4FF")) }
                      visibility = View.GONE
                  }
                  rootContainer.addView(miniBubble, LinearLayout.LayoutParams(95, 95))

                  menuCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(12, 10, 12, 10)
                      background = GradientDrawable().apply { cornerRadius = 24f; setColor(Color.parseColor("#F21E1E24")); setStroke(2, Color.parseColor("#374151")) }
                  }

                  fun createItemBtn(title: String, col: Int): Button {
                      return Button(this).apply {
                          text = title; textSize = 12f; setTextColor(Color.WHITE)
                          background = GradientDrawable().apply { cornerRadius = 16f; setColor(col) }
                          setPadding(16, 6, 16, 6)
                      }
                  }

                  val headerRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val titleTv = TextView(this).apply { text = "KHOBAU BOT"; textSize = 11f; setTextColor(Color.parseColor("#9CA3AF")); setPadding(6, 0, 16, 0) }
                  val btnMinimize = Button(this).apply {
                      text = "▲ Thu"; textSize = 10f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { cornerRadius = 12f; setColor(Color.parseColor("#4B5563")) }
                  }
                  val btnClose = Button(this).apply {
                      text = "✕"; textSize = 10f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { cornerRadius = 12f; setColor(Color.parseColor("#374151")) }
                  }
                  headerRow.addView(titleTv, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  headerRow.addView(btnMinimize, LinearLayout.LayoutParams(95, 55).apply { marginEnd = 6 })
                  headerRow.addView(btnClose, LinearLayout.LayoutParams(65, 55))

                  val bStart = createItemBtn("▶ START AUTO", Color.parseColor("#059669"))
                  val bGoc = createItemBtn("🎯 ĐẶT LẠI GỐC", Color.parseColor("#4F46E5"))
                  val bJoy = createItemBtn("🕹 ĐẶT JOYSTICK", Color.parseColor("#0891B2"))
                  val bHunt = createItemBtn("⚔ QUÁI: TẮT", Color.parseColor("#4B5563"))
                  val bHudToggle = createItemBtn("👁 KHUNG: BẬT", Color.parseColor("#2563EB"))

                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 68).apply { topMargin = 8 }
                  menuCard.addView(headerRow)
                  menuCard.addView(bStart, lp); menuCard.addView(bGoc, lp); menuCard.addView(bJoy, lp)
                  menuCard.addView(bHunt, lp); menuCard.addView(bHudToggle, lp)
                  rootContainer.addView(menuCard, LinearLayout.LayoutParams(260, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val pRoot = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 30; y = 140
                  }
                  wm.addView(rootContainer, pRoot)

                  val pJoy = WindowManager.LayoutParams(120, 120, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (CaptureService.inst?.joyX?.toInt() ?: (sW / 2)) - 60
                      y = (CaptureService.inst?.joyY?.toInt() ?: (sH * 64 / 100)) - 60
                  }
                  joyView = TextView(this).apply {
                      text = "JOY\n(Chốt)"; gravity = Gravity.CENTER; textSize = 11f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#B300E676")) }
                  }

                  btnMinimize.setOnClickListener { menuCard.visibility = View.GONE; miniBubble.visibility = View.VISIBLE }
                  miniBubble.setOnClickListener { miniBubble.visibility = View.GONE; menuCard.visibility = View.VISIBLE }

                  bStart.setOnClickListener {
                      val a = CaptureService.inst?.toggleRun() ?: false
                      bStart.text = if (a) "⏹ STOP AUTO" else "▶ START AUTO"
                      (bStart.background as? GradientDrawable)?.setColor(if (a) Color.parseColor("#D97706") else Color.parseColor("#059669"))
                  }

                  bGoc.setOnClickListener { CaptureService.inst?.resetAnchor() }
                  bJoy.setOnClickListener {
                      pJoy.x = (CaptureService.inst?.joyX?.toInt() ?: (sW / 2)) - 60
                      pJoy.y = (CaptureService.inst?.joyY?.toInt() ?: (sH * 64 / 100)) - 60
                      if (joyView.parent == null) wm.addView(joyView, pJoy) else wm.removeView(joyView)
                  }
                  joyView.setOnClickListener {
                      val loc = IntArray(2); joyView.getLocationOnScreen(loc)
                      CaptureService.inst?.joyX = loc[0] + joyView.width / 2f
                      CaptureService.inst?.joyY = loc[1] + joyView.height / 2f
                      Toast.makeText(this, "Đã chốt Joystick!", Toast.LENGTH_SHORT).show()
                      if (joyView.parent != null) wm.removeView(joyView)
                  }

                  bHunt.setOnClickListener {
                      val s = CaptureService.inst ?: return@setOnClickListener
                      s.enableHuntMonster = !s.enableHuntMonster
                      bHunt.text = if (s.enableHuntMonster) "⚔ QUÁI: BẬT" else "⚔ QUÁI: TẮT"
                      (bHunt.background as? GradientDrawable)?.setColor(if (s.enableHuntMonster) Color.parseColor("#D97706") else Color.parseColor("#4B5563"))
                  }

                  bHudToggle.setOnClickListener {
                      hudView.isHudVisible = !hudView.isHudVisible
                      bHudToggle.text = if (hudView.isHudVisible) "👁 KHUNG: BẬT" else "Ø KHUNG: TẮT"
                      (bHudToggle.background as? GradientDrawable)?.setColor(if (hudView.isHudVisible) Color.parseColor("#2563EB") else Color.parseColor("#4B5563"))
                      hudView.postInvalidate()
                  }

                  btnClose.setOnClickListener { killAppAndExit() }

                  fun drag(v: View, p: WindowManager.LayoutParams, targetView: View) {
                      var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { ix = p.x; iy = p.y; tx = e.rawX; ty = e.rawY; false }
                              MotionEvent.ACTION_MOVE -> {
                                  p.x = ix + (e.rawX - tx).toInt()
                                  p.y = iy + (e.rawY - ty).toInt()
                                  wm.updateViewLayout(targetView, p)
                                  true
                              }
                              else -> false
                          }
                      }
                  }
                  drag(headerRow, pRoot, rootContainer); drag(miniBubble, pRoot, rootContainer); drag(joyView, pJoy, joyView)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  killAppAndExit()
                  inst = null
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-v4.4-APK
          path: app/build/outputs/apk/debug/*.apk
