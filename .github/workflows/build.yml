name: Build KhobauBot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tao Cau Hinh He Thong
        run: |
          mkdir -p app/src/main/java/com/bot app/src/main/res/xml
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'Khobaubot'; include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo -e "plugins {\n id 'com.android.application' version '8.2.2' apply false\n id 'org.jetbrains.kotlin.android' version '1.9.22' apply false\n}" > build.gradle

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.bot'; compileSdk 34
              defaultConfig { applicationId 'com.bot'; minSdk 24; targetSdk 33; versionCode 63; versionName '8.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          EOF

          echo '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:canPerformGestures="true" />' > app/src/main/res/xml/acc.xml

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="KhobauBot" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="ocr" />
                  <activity android:name="com.bot.MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name="com.bot.BotAccService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
                  <service android:name="com.bot.FloatingService" android:exported="false"/>
                  <service android:name="com.bot.CaptureService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF
      - name: Tao Code App Va Build APK
        run: |
          cat << 'EOF' > app/src/main/java/com/bot/App.kt
          package com.bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.util.concurrent.TimeUnit
          import kotlin.math.*

          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import com.google.android.gms.tasks.Tasks

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(40, 40, 40, 40) }
                  val bAcc = Button(this).apply { text = "1. BẬT TRỢ NĂNG (BẮT BUỘC)"; setBackgroundColor(Color.parseColor("#E65100")); setTextColor(Color.WHITE) }
                  val bStart = Button(this).apply { text = "2. KHỞI ĐỘNG KHOBAUBOT"; setBackgroundColor(Color.parseColor("#2E7D32")); setTextColor(Color.WHITE) }
                  l.addView(bAcc); l.addView(bStart); setContentView(l)

                  bAcc.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      Toast.makeText(this, "Tìm KhobauBot và Gạt BẬT!", Toast.LENGTH_LONG).show()
                  }
                  bStart.setOnClickListener {
                      if (BotAccService.inst == null) {
                          Toast.makeText(this, "Vui lòng bật quyền Trợ năng ở nút 1 trước!", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Cấp quyền Cửa sổ nổi!", Toast.LENGTH_SHORT).show()
                          startActivityForResult(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")), 1)
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mpm.createScreenCaptureIntent(), 2)
                  }
              }
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 2 && res == Activity.RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java).apply { putExtra("C", res); putExtra("D", data) }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                      startService(Intent(this, FloatingService::class.java))
                      moveTaskToBack(true)
                  }
              }
          }

          class BotAccService : AccessibilityService() {
              companion object { var inst: BotAccService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); inst = this }
              override fun onDestroy() { super.onDestroy(); inst = null }
              override fun onAccessibilityEvent(e: android.view.accessibility.AccessibilityEvent?) {}
              override fun onInterrupt() {}

              // KÉO TOÀN TỐC MƯỢT MÀ: Giữ cần gạt liên tục
              fun walkToward(jx: Float, jy: Float, angle: Double, dMs: Long = 450L) {
                  val endX = jx + (125f * cos(angle)).toFloat()
                  val endY = jy + (125f * sin(angle)).toFloat()
                  val startX = jx + (40f * cos(angle)).toFloat()
                  val startY = jy + (40f * sin(angle)).toFloat()

                  val p = Path().apply {
                      moveTo(startX, startY)
                      lineTo(endX, endY)
                  }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, dMs)).build(), null, null)
              }
          }

          data class VisualTile(val id: Int, val wX: Int, val wY: Int, val isActive: Boolean, val statusText: String)

          class TrackingOverlayView(ctx: Context) : View(ctx) {
              var isHudVisible = true
              private var tileList = listOf<VisualTile>()
              private var curPlayerX = 0
              private var curPlayerY = 0
              var playerScreenX = 360f
              var playerScreenY = 515f
              var tileSize = 54f
              private var bannerText = ""

              private val pActiveBox = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 3.5f; color = Color.parseColor("#00E676"); isAntiAlias = true }
              private val pNextBox = Paint().apply { style = Paint.Style.STROKE; strokeWidth = 3f; color = Color.parseColor("#FF9100"); isAntiAlias = true }
              private val pBadgeActive = Paint().apply { style = Paint.Style.FILL; color = Color.parseColor("#00E676"); isAntiAlias = true }
              private val pBadgeNext = Paint().apply { style = Paint.Style.FILL; color = Color.parseColor("#FF9100"); isAntiAlias = true }

              private val pNumText = Paint().apply { textSize = 20f; isFakeBoldText = true; color = Color.BLACK; textAlign = Paint.Align.CENTER; isAntiAlias = true }
              private val pStatusText = Paint().apply { textSize = 16f; isFakeBoldText = true; color = Color.WHITE; setShadowLayer(3f, 1f, 1f, Color.BLACK); isAntiAlias = true }
              private val pCoordText = Paint().apply { textSize = 13f; color = Color.parseColor("#E0E0E0"); textAlign = Paint.Align.CENTER; setShadowLayer(2f, 1f, 1f, Color.BLACK); isAntiAlias = true }

              private val pBannerBg = Paint().apply { color = Color.parseColor("#EE111827"); style = Paint.Style.FILL }
              private val pBannerText = Paint().apply { textSize = 17f; isFakeBoldText = true; color = Color.WHITE; isAntiAlias = true }

              fun updateDisplay(tiles: List<VisualTile>, pX: Float, pY: Float, cX: Int, cY: Int, banner: String) {
                  tileList = tiles; playerScreenX = pX; playerScreenY = pY
                  curPlayerX = cX; curPlayerY = cY
                  bannerText = banner; postInvalidate()
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  if (!isHudVisible) return

                  val half = tileSize / 2f

                  for (tile in tileList) {
                      val screenX = playerScreenX + (tile.wX - curPlayerX) * tileSize
                      val screenY = playerScreenY - (tile.wY - curPlayerY) * tileSize

                      val r = RectF(screenX - half, screenY - half, screenX + half, screenY + half)
                      c.drawRoundRect(r, 6f, 6f, if (tile.isActive) pActiveBox else pNextBox)

                      val badgeY = screenY - half - 8f
                      c.drawCircle(screenX, badgeY, 15f, if (tile.isActive) pBadgeActive else pBadgeNext)

                      val numY = badgeY - ((pNumText.descent() + pNumText.ascent()) / 2f)
                      c.drawText(tile.id.toString(), screenX, numY, pNumText)
                      c.drawText("(${tile.wX},${tile.wY})", screenX, screenY + half + 16f, pCoordText)

                      if (tile.statusText.isNotEmpty()) {
                          c.drawText(tile.statusText, screenX - 32f, screenY + half + 34f, pStatusText)
                      }
                  }

                  if (bannerText.isNotEmpty()) {
                      c.drawRoundRect(15f, 60f, 690f, 126f, 14f, 14f, pBannerBg)
                      c.drawText(bannerText, 30f, 100f, pBannerText)
                  }
              }
          }

          class CaptureService : Service() {
              companion object { var inst: CaptureService? = null }
              private var mp: MediaProjection? = null
              private var reader: ImageReader? = null
              private var lastBmp: Bitmap? = null

              var joyX = 360f
              var joyY = 820f

              private val textRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

              // TỌA ĐỘ GPS CHẠY TRÊN LUỒNG ĐỘC LẬP
              var currX: Int? = null
              var currY: Int? = null
              var homeX: Int? = null
              var homeY: Int? = null
              var lastRawText = ""

              // VỊ TRÍ DẪN VỀ KHẨN CẤP
              var customTargetX: Int? = null
              var customTargetY: Int? = null
              var isNavigatingToCustom = false

              // 2 Ô MỤC TIÊU VÒNG HIỆN TẠI & GỐI ĐẦU
              private var tile1: Pair<Int, Int>? = null
              private var tile2: Pair<Int, Int>? = null
              private var nextTile1: Pair<Int, Int>? = null
              private var nextTile2: Pair<Int, Int>? = null

              private var currentStep = 1
              private var isStandingStill = false
              private var standStartTime = 0L

              private val minedTiles = mutableMapOf<Pair<Int, Int>, Long>()

              private var running = false
              private var botJob: Job? = null
              private var ocrJob: Job? = null
              private var sW = 720
              private var sH = 1280
              var tileSize = 54f

              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  val dm = resources.displayMetrics
                  sW = dm.widthPixels; sH = dm.heightPixels
                  joyX = sW * 0.5f; joyY = sH * 0.64f

                  val chId = "bot_v80"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val m = getSystemService(NotificationManager::class.java)
                      m?.createNotificationChannel(NotificationChannel(chId, "Bot", NotificationManager.IMPORTANCE_LOW))
                  }
                  val n = NotificationCompat.Builder(this, chId).setContentTitle("KhobauBot v8.0").setSmallIcon(android.R.drawable.ic_media_play).build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) startForeground(163, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION) else startForeground(163, n)
              }

              @SuppressLint("WrongConstant")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("C", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("D")
                  if (code == Activity.RESULT_OK && data != null) {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mp = mpm.getMediaProjection(code, data)
                      mp?.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
                      reader = ImageReader.newInstance(sW, sH, PixelFormat.RGBA_8888, 2)
                      mp?.createVirtualDisplay("V", sW, sH, resources.displayMetrics.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader?.surface, null, null)

                      startBackgroundOCR()
                  }
                  return START_STICKY
              }

              // LUỒNG ĐỌC GPS QUẢ CẦU CHẠY NGẦM ĐỘC LẬP (KHÔNG LÀM KHỰNG BƯỚC ĐI)
              private fun startBackgroundOCR() {
                  ocrJob?.cancel()
                  ocrJob = CoroutineScope(Dispatchers.Default).launch {
                      while (true) {
                          val scr = getScreen()
                          if (scr != null) {
                              val coord = extractGlobeCoordinates(scr)
                              if (coord != null) {
                                  currX = coord.first
                                  currY = coord.second
                                  if (homeX == null && !isNavigatingToCustom) {
                                      homeX = currX; homeY = currY
                                  }
                              }
                          }
                          delay(100)
                      }
                  }
              }

              fun saveCurrentAsHome() {
                  val cx = currX; val cy = currY
                  if (cx != null && cy != null) {
                      homeX = cx; homeY = cy
                      customTargetX = cx; customTargetY = cy
                      Toast.makeText(this, "Đã lưu gốc: ($cx, $cy)", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "Đang chờ đọc GPS Quả Cầu...", Toast.LENGTH_SHORT).show()
                  }
              }

              fun startNavigateHome() {
                  val hx = homeX ?: customTargetX
                  val hy = homeY ?: customTargetY
                  if (hx != null && hy != null) {
                      customTargetX = hx
                      customTargetY = hy
                      isNavigatingToCustom = true
                      tile1 = null; tile2 = null
                      nextTile1 = null; nextTile2 = null
                      isStandingStill = false
                      Toast.makeText(this, "Đang kéo về Gốc ($hx, $hy)...", Toast.LENGTH_SHORT).show()
                      if (!running) toggleRun()
                  } else {
                      Toast.makeText(this, "Chưa lưu gốc! Hãy bấm LƯU GỐC trước.", Toast.LENGTH_SHORT).show()
                  }
              }

              fun stopCompletely() {
                  running = false
                  botJob?.cancel(); ocrJob?.cancel()
                  try { mp?.stop() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  stopForeground(true); stopSelf()
              }

              fun getScreen(): Bitmap? {
                  val img = reader?.acquireLatestImage() ?: return lastBmp
                  try {
                      val pl = img.planes[0]; val buf = pl.buffer
                      val pad = pl.rowStride - pl.pixelStride * sW
                      val bmp = Bitmap.createBitmap(sW + pad / pl.pixelStride, sH, Bitmap.Config.ARGB_8888)
                      bmp.copyPixelsFromBuffer(buf)
                      lastBmp = if (pad > 0) Bitmap.createBitmap(bmp, 0, 0, sW, sH) else bmp
                  } catch (e: Exception) {} finally { img.close() }
                  return lastBmp
              }

              fun toggleRun(): Boolean {
                  running = !running
                  if (running) {
                      if (BotAccService.inst == null) {
                          Toast.makeText(this, "CHƯA BẬT TRỢ NĂNG!", Toast.LENGTH_LONG).show()
                          running = false; return false
                      }
                      tile1 = null; tile2 = null
                      nextTile1 = null; nextTile2 = null
                      currentStep = 1
                      isStandingStill = false
                      minedTiles.clear()

                      botJob = CoroutineScope(Dispatchers.Default).launch {
                          while (running) {
                              val cX = currX
                              val cY = currY

                              if (cX == null || cY == null) {
                                  FloatingService.inst?.updateHUDList(emptyList(), 360f, 515f, 0, 0, "Đang bắt GPS... [Thử: '$lastRawText']")
                                  delay(100); continue
                              }

                              val now = System.currentTimeMillis()
                              val px = 360f
                              val py = 515f

                              val itMined = minedTiles.iterator()
                              while (itMined.hasNext()) {
                                  if (now - itMined.next().value > 15000L) itMined.remove()
                              }

                              // 1. CHẾ ĐỘ DẪN VỀ GỐC
                              if (isNavigatingToCustom && customTargetX != null && customTargetY != null) {
                                  val tX = customTargetX!!
                                  val tY = customTargetY!!
                                  val dX = tX - cX
                                  val dY = tY - cY

                                  if (dX == 0 && dY == 0) {
                                      isNavigatingToCustom = false
                                      homeX = tX; homeY = tY
                                      FloatingService.inst?.updateHUDList(emptyList(), px, py, cX, cY, "✔ ĐÃ VỀ GỐC ($tX, $tY)! Bắt đầu Auto...")
                                      delay(350); continue
                                  } else {
                                      val angle = atan2(-(dY).toDouble(), dX.toDouble())
                                      FloatingService.inst?.updateHUDList(emptyList(), px, py, cX, cY, "▶ Đang về Gốc ($tX, $tY)...")
                                      BotAccService.inst?.walkToward(joyX, joyY, angle, 420L)
                                      delay(380L); continue
                                  }
                              }

                              val hX = homeX ?: cX
                              val hY = homeY ?: cY

                              // 2. BẢO VỆ VÙNG ±7 Ô: TỰ ĐỘNG KÉO VỀ NẾU VƯỢT QUÁ
                              if (abs(cX - hX) > 7 || abs(cY - hY) > 7) {
                                  tile1 = null; tile2 = null
                                  nextTile1 = null; nextTile2 = null
                                  isStandingStill = false

                                  val dX = hX - cX
                                  val dY = hY - cY
                                  val angle = atan2(-(dY).toDouble(), dX.toDouble())

                                  FloatingService.inst?.updateHUDList(emptyList(), px, py, cX, cY, "VƯỢT VÙNG 7 Ô! Kéo về Gốc...")
                                  BotAccService.inst?.walkToward(joyX, joyY, angle, 420L)
                                  delay(380L); continue
                              }

                              // 3. QUÉT 2 Ô TRONG PHẠM VI ±7 NẾU CHƯA CÓ
                              val scr = getScreen()
                              if (scr != null && (tile1 == null || tile2 == null)) {
                                  val scanned = scanTwoTiles(scr, px, py, cX, cY, hX, hY)
                                  if (tile1 == null && scanned.isNotEmpty()) tile1 = scanned[0]
                                  if (tile2 == null && scanned.size > 1) tile2 = scanned[1]
                                  currentStep = 1
                                  isStandingStill = false
                              }

                              updateVisualHUD(px, py, cX, cY, hX, hY, now)

                              if (tile1 == null) { delay(120); continue }

                              // 4. XỬ LÝ Ô 1: KÉO MƯỢT VÀO TÂM -> ĐỨNG YÊN 4.0 GIÂY
                              if (currentStep == 1) {
                                  val t1 = tile1!!
                                  val dX = t1.first - cX
                                  val dY = t1.second - cY

                                  if (dX == 0 && dY == 0) {
                                      if (!isStandingStill) {
                                          isStandingStill = true
                                          standStartTime = now
                                      }
                                      val elapsed = now - standStartTime
                                      if (elapsed >= 4000L) {
                                          minedTiles[t1] = now
                                          currentStep = 2
                                          isStandingStill = false
                                          delay(50); continue
                                      }
                                      delay(120); continue
                                  } else {
                                      isStandingStill = false
                                      val angle = atan2(-(dY).toDouble(), dX.toDouble())
                                      BotAccService.inst?.walkToward(joyX, joyY, angle, 350L)
                                      delay(280L); continue
                                  }
                              }

                              // 5. XỬ LÝ Ô 2: KÉO MƯỢT VÀO TÂM -> ĐỨNG YÊN 4.0S (QUÉT GỐI ĐẦU)
                              if (currentStep == 2) {
                                  if (tile2 == null) {
                                      tile1 = null; currentStep = 1
                                      delay(50); continue
                                  }
                                  val t2 = tile2!!
                                  val dX = t2.first - cX
                                  val dY = t2.second - cY

                                  if (dX == 0 && dY == 0) {
                                      if (!isStandingStill) {
                                          isStandingStill = true
                                          standStartTime = now
                                          nextTile1 = null; nextTile2 = null
                                      }
                                      val elapsed = now - standStartTime

                                      // Trong lúc đứng đập ở Ô 2: Quét trước 2 ô cho vòng tiếp theo
                                      if (elapsed >= 1000L && (nextTile1 == null || nextTile2 == null) && scr != null) {
                                          minedTiles[t2] = now
                                          val scannedNext = scanTwoTiles(scr, px, py, cX, cY, hX, hY)
                                          if (scannedNext.isNotEmpty()) nextTile1 = scannedNext[0]
                                          if (scannedNext.size > 1) nextTile2 = scannedNext[1]
                                      }

                                      if (elapsed >= 4000L) {
                                          minedTiles[t2] = now
                                          tile1 = nextTile1
                                          tile2 = nextTile2
                                          nextTile1 = null; nextTile2 = null
                                          currentStep = 1
                                          isStandingStill = false
                                          delay(50); continue
                                      }
                                      delay(120); continue
                                  } else {
                                      isStandingStill = false
                                      val angle = atan2(-(dY).toDouble(), dX.toDouble())
                                      BotAccService.inst?.walkToward(joyX, joyY, angle, 350L)
                                      delay(280L); continue
                                  }
                              }
                          }
                      }
                  } else {
                      botJob?.cancel()
                      FloatingService.inst?.updateHUDList(emptyList(), 0f, 0f, 0, 0, "")
                  }
                  return running
              }

              private fun updateVisualHUD(px: Float, py: Float, cX: Int, cY: Int, hX: Int, hY: Int, now: Long) {
                  val vList = mutableListOf<VisualTile>()
                  tile1?.let { t1 ->
                      val isAct = (currentStep == 1)
                      val st = when {
                          isAct && isStandingStill -> {
                              val rem = max(0.0, (4000L - (now - standStartTime)) / 1000.0)
                              String.format("⛏ ĐỢI 4S (%.1fs)", rem)
                          }
                          isAct -> "▶ ĐANG TỚI"
                          else -> "✔ ĐÃ XONG"
                      }
                      vList.add(VisualTile(1, t1.first, t1.second, isAct, st))
                  }
                  tile2?.let { t2 ->
                      val isAct = (currentStep == 2)
                      val st = when {
                          isAct && isStandingStill -> {
                              val rem = max(0.0, (4000L - (now - standStartTime)) / 1000.0)
                              val sub = if (nextTile1 != null) " [Gối đầu xong]" else ""
                              String.format("⛏ ĐỢI 4S (%.1fs)%s", rem, sub)
                          }
                          isAct -> "▶ ĐANG TỚI"
                          else -> "⏳ CHỜ SẴN"
                      }
                      vList.add(VisualTile(2, t2.first, t2.second, isAct, st))
                  }
                  val banner = "GPS: ($cX, $cY) | Gốc: ($hX, $hY) [Vùng ±7] | Ô $currentStep"
                  FloatingService.inst?.updateHUDList(vList, px, py, cX, cY, banner)
              }

              // PHÓNG TO 4X NEAREST-NEIGHBOR & BỘ LỌC ĐƠN SẮC CHỮ PIXEL 8-BIT
              private fun preprocessPixelFont(src: Bitmap): Bitmap {
                  val scale = 4
                  val w = src.width * scale; val h = src.height * scale
                  val scaled = Bitmap.createScaledBitmap(src, w, h, false)
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val pixels = IntArray(w * h)
                  scaled.getPixels(pixels, 0, w, 0, 0, w, h)
                  for (i in pixels.indices) {
                      val p = pixels[i]
                      val r = (p shr 16) and 0xFF; val g = (p shr 8) and 0xFF; val b = p and 0xFF
                      val lum = (r * 299 + g * 587 + b * 114) / 1000
                      if (lum > 95) pixels[i] = Color.BLACK else pixels[i] = Color.WHITE
                  }
                  out.setPixels(pixels, 0, w, 0, 0, w, h)
                  return out
              }

              // CẮT CHUẨN XÁC DÒNG QUẢ ĐỊA CẦU VÀ GIẢI MÃ CHỮ PIXEL
              private fun extractGlobeCoordinates(scr: Bitmap): Pair<Int, Int>? {
                  try {
                      val cropX = (sW * 0.74f).toInt().coerceIn(0, scr.width - 20)
                      val cropY = (sH * 0.18f).toInt().coerceIn(0, scr.height - 20)
                      val cropW = (sW * 0.25f).toInt().coerceAtMost(scr.width - cropX)
                      val cropH = (sH * 0.07f).toInt().coerceAtMost(scr.height - cropY)

                      val rawCrop = Bitmap.createBitmap(scr, cropX, cropY, cropW, cropH)
                      val cleanBmp = preprocessPixelFont(rawCrop)

                      val image = InputImage.fromBitmap(cleanBmp, 0)
                      val task = textRecognizer.process(image)
                      val result = Tasks.await(task, 300, TimeUnit.MILLISECONDS)

                      val candidates = mutableListOf<Pair<Int, Pair<Int, Int>>>()

                      for (block in result.textBlocks) {
                          for (line in block.lines) {
                              val txt = line.text
                              if (txt.contains(":") || txt.contains("Asia", true)) continue

                              val normalized = txt.replace('O', '0').replace('o', '0').replace('D', '0')
                                  .replace('I', '1').replace('l', '1').replace('|', '1').replace('i', '1')
                                  .replace('S', '5').replace('s', '5').replace('B', '8')

                              val regex = Regex("""(-?\d{1,4})[^\d-]+(-?\d{1,4})""")
                              val m = regex.find(normalized)
                              if (m != null) {
                                  val x = m.groupValues[1].toIntOrNull()
                                  val y = m.groupValues[2].toIntOrNull()
                                  if (x != null && y != null && abs(x) < 2000 && abs(y) < 2000) {
                                      val topY = line.boundingBox?.top ?: 0
                                      candidates.add(Pair(topY, Pair(x, y)))
                                  }
                              }
                          }
                      }
                      if (candidates.isNotEmpty()) {
                          candidates.sortBy { it.first }
                          lastRawText = "${candidates[0].second.first},${candidates[0].second.second}"
                          return candidates[0].second
                      }
                  } catch (e: Exception) {}
                  return null
              }

              private fun isWikiTileColor(r: Int, g: Int, b: Int): Boolean {
                  if (g > r + 18 && g > b + 18) return false
                  if (r < 70 && g < 70 && b < 70) return false
                  val isDirt400 = (r in 110..185 && g in 65..135 && b in 25..100 && r > g + 12 && g > b + 6)
                  val isStone900 = (r in 115..215 && g in 115..215 && b in 110..210 && abs(r - g) < 20 && abs(g - b) < 20 && r > 110)
                  val isMoss1100 = (g in 115..190 && r in 100..175 && b in 40..110 && g >= r - 12 && r > b + 20)
                  return isDirt400 || isStone900 || isMoss1100
              }

              private fun isWikiTileAt(scr: Bitmap, cx: Float, cy: Float): Boolean {
                  val checkPoints = arrayOf(
                      Pair(0, 0), Pair(-14, -14), Pair(14, -14),
                      Pair(-14, 14), Pair(14, 14), Pair(-14, 0),
                      Pair(14, 0), Pair(0, -14), Pair(0, 14)
                  )
                  var matchCount = 0
                  for (pt in checkPoints) {
                      val qx = (cx + pt.first).toInt().coerceIn(0, scr.width - 1)
                      val qy = (cy + pt.second).toInt().coerceIn(0, scr.height - 1)
                      val c = scr.getPixel(qx, qy)
                      if (isWikiTileColor(c shr 16 and 0xFF, c shr 8 and 0xFF, c and 0xFF)) matchCount++
                  }
                  return matchCount >= 5
              }

              private fun scanTwoTiles(scr: Bitmap, px: Float, py: Float, cX: Int, cY: Int, hX: Int, hY: Int): List<Pair<Int, Int>> {
                  val found = mutableListOf<Pair<Int, Int>>()
                  for (dy in -4..4) {
                      for (dx in -4..4) {
                          if (dx == 0 && dy == 0) continue
                          val wX = cX + dx
                          val wY = cY + dy

                          if (abs(wX - hX) > 7 || abs(wY - hY) > 7) continue
                          if (minedTiles.containsKey(Pair(wX, wY))) continue

                          val screenX = px + dx * tileSize
                          val screenY = py - dy * tileSize

                          if (screenX < 60f || screenX > (sW - 60f) || screenY < (sH * 0.22f) || screenY > (sH * 0.65f)) continue
                          if (isWikiTileAt(scr, screenX, screenY)) found.add(Pair(wX, wY))
                      }
                  }
                  found.sortBy { abs(it.first - cX) + abs(it.second - cY) }
                  return found.take(2)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopCompletely()
                  inst = null
              }
          }

          class FloatingService : Service() {
              companion object { var inst: FloatingService? = null }
              private lateinit var wm: WindowManager
              private lateinit var rootContainer: LinearLayout
              private lateinit var miniBubble: TextView
              private lateinit var menuCard: LinearLayout
              private lateinit var joyView: TextView
              var hudView: TrackingOverlayView? = null
              private lateinit var pRoot: WindowManager.LayoutParams

              private var sW = 720; private var sH = 1280

              override fun onBind(i: Intent?): IBinder? = null

              fun updateHUDList(tiles: List<VisualTile>, px: Float, py: Float, cX: Int, cY: Int, banner: String) {
                  hudView?.updateDisplay(tiles, px, py, cX, cY, banner)
              }

              private fun killAppAndExit() {
                  try { CaptureService.inst?.stopCompletely() } catch (e: Exception) {}
                  try {
                      if (hudView != null && hudView?.parent != null) wm.removeView(hudView)
                      if (::rootContainer.isInitialized && rootContainer.parent != null) wm.removeView(rootContainer)
                      if (::joyView.isInitialized && joyView.parent != null) wm.removeView(joyView)
                  } catch (e: Exception) {}
                  stopSelf(); android.os.Process.killProcess(android.os.Process.myPid())
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val dm = resources.displayMetrics
                  sW = dm.widthPixels; sH = dm.heightPixels

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                  hudView = TrackingOverlayView(this)
                  wm.addView(hudView, WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, type,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ))

                  rootContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  miniBubble = TextView(this).apply {
                      text = "💎"; textSize = 18f; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#E6212121")); setStroke(2, Color.parseColor("#40C4FF")) }
                      visibility = View.GONE
                  }
                  rootContainer.addView(miniBubble, LinearLayout.LayoutParams(85, 85))

                  // MENU THU NHỎ SIÊU GỌN (160DP)
                  menuCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(10, 8, 10, 8)
                      background = GradientDrawable().apply { cornerRadius = 18f; setColor(Color.parseColor("#F21E1E24")); setStroke(2, Color.parseColor("#374151")) }
                  }

                  fun createItemBtn(title: String, col: Int): Button {
                      return Button(this).apply {
                          text = title; textSize = 10.5f; setTextColor(Color.WHITE)
                          setAllCaps(false)
                          background = GradientDrawable().apply { cornerRadius = 12f; setColor(col) }
                          setPadding(6, 2, 6, 2)
                      }
                  }

                  val headerRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val titleTv = TextView(this).apply { text = "KHOBAU v8.0"; textSize = 10f; isFakeBoldText = true; setTextColor(Color.parseColor("#38BDF8")) }
                  val btnMinimize = Button(this).apply {
                      text = "▲"; textSize = 9f; setTextColor(Color.WHITE)
                      setAllCaps(false)
                      background = GradientDrawable().apply { cornerRadius = 10f; setColor(Color.parseColor("#4B5563")) }
                  }
                  val btnClose = Button(this).apply {
                      text = "✕"; textSize = 9f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { cornerRadius = 10f; setColor(Color.parseColor("#374151")) }
                  }
                  headerRow.addView(titleTv, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  headerRow.addView(btnMinimize, LinearLayout.LayoutParams(60, 44).apply { marginEnd = 4 })
                  headerRow.addView(btnClose, LinearLayout.LayoutParams(50, 44))

                  val bStart = createItemBtn("▶ START AUTO", Color.parseColor("#059669"))
                  val bSaveHome = createItemBtn("📍 LƯU GỐC", Color.parseColor("#2563EB"))
                  val bGoHome = createItemBtn("🚀 VỀ GỐC", Color.parseColor("#7C3AED"))
                  val bJoy = createItemBtn("🕹 ĐẶT JOYSTICK", Color.parseColor("#0891B2"))
                  val bHudToggle = createItemBtn("👁 KHUNG: BẬT", Color.parseColor("#374151"))

                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 56).apply { topMargin = 5 }
                  menuCard.addView(headerRow)
                  menuCard.addView(bStart, lp)
                  menuCard.addView(bSaveHome, lp)
                  menuCard.addView(bGoHome, lp)
                  menuCard.addView(bJoy, lp)
                  menuCard.addView(bHudToggle, lp)
                  rootContainer.addView(menuCard, LinearLayout.LayoutParams(160, LinearLayout.LayoutParams.WRAP_CONTENT))

                  pRoot = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 20; y = 140
                  }
                  wm.addView(rootContainer, pRoot)

                  val pJoy = WindowManager.LayoutParams(120, 120, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (CaptureService.inst?.joyX?.toInt() ?: (sW / 2)) - 60
                      y = (CaptureService.inst?.joyY?.toInt() ?: (sH * 64 / 100)) - 60
                  }
                  joyView = TextView(this).apply {
                      text = "JOY\n(Chốt)"; gravity = Gravity.CENTER; textSize = 11f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor("#B300E676")) }
                  }

                  btnMinimize.setOnClickListener { menuCard.visibility = View.GONE; miniBubble.visibility = View.VISIBLE }
                  miniBubble.setOnClickListener { miniBubble.visibility = View.GONE; menuCard.visibility = View.VISIBLE }

                  bStart.setOnClickListener {
                      val a = CaptureService.inst?.toggleRun() ?: false
                      bStart.text = if (a) "⏹ DỪNG AUTO" else "▶ START AUTO"
                      (bStart.background as? GradientDrawable)?.setColor(if (a) Color.parseColor("#D97706") else Color.parseColor("#059669"))
                  }

                  bSaveHome.setOnClickListener { CaptureService.inst?.saveCurrentAsHome() }
                  bGoHome.setOnClickListener { CaptureService.inst?.startNavigateHome() }

                  bJoy.setOnClickListener {
                      pJoy.x = (CaptureService.inst?.joyX?.toInt() ?: (sW / 2)) - 60
                      pJoy.y = (CaptureService.inst?.joyY?.toInt() ?: (sH * 64 / 100)) - 60
                      if (joyView.parent == null) wm.addView(joyView, pJoy) else wm.removeView(joyView)
                  }
                  joyView.setOnClickListener {
                      val loc = IntArray(2); joyView.getLocationOnScreen(loc)
                      CaptureService.inst?.joyX = loc[0] + joyView.width / 2f
                      CaptureService.inst?.joyY = loc[1] + joyView.height / 2f
                      Toast.makeText(this, "Đã chốt Joystick!", Toast.LENGTH_SHORT).show()
                      if (joyView.parent != null) wm.removeView(joyView)
                  }

                  bHudToggle.setOnClickListener {
                      val h = hudView ?: return@setOnClickListener
                      h.isHudVisible = !h.isHudVisible
                      bHudToggle.text = if (h.isHudVisible) "👁 KHUNG: BẬT" else "Ø KHUNG: TẮT"
                      (bHudToggle.background as? GradientDrawable)?.setColor(if (h.isHudVisible) Color.parseColor("#2563EB") else Color.parseColor("#374151"))
                      h.postInvalidate()
                  }

                  btnClose.setOnClickListener { killAppAndExit() }

                  fun drag(v: View, p: WindowManager.LayoutParams, targetView: View) {
                      var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { ix = p.x; iy = p.y; tx = e.rawX; ty = e.rawY; false }
                              MotionEvent.ACTION_MOVE -> {
                                  p.x = ix + (e.rawX - tx).toInt()
                                  p.y = iy + (e.rawY - ty).toInt()
                                  wm.updateViewLayout(targetView, p)
                                  true
                              }
                              else -> false
                          }
                      }
                  }
                  drag(headerRow, pRoot, rootContainer); drag(miniBubble, pRoot, rootContainer); drag(joyView, pJoy, joyView)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  killAppAndExit()
                  inst = null
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KhobauBot-v8.0-Compact-APK
          path: app/build/outputs/apk/debug/*.apk
